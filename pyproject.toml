[build-system]
requires = ["setuptools>=61,!=79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "geode"
version = "0.0.0"
description = "Geospatial Earth Observation Data Engine"
requires-python = ">=3.11"
dependencies = [
	"numpy>=1.23.4,",
	"icechunk>=2",
	"netCDF4",
	"pywis-pubsub>=0.12.0",
	"PyYAML",
	"requests>=2.32.3",
	"SQLAlchemy",
	"wxflow>=0.2.0",
	"xarray>=2025.8.0",
]

[project.optional-dependencies]
dev = [
	"pytest==9.1.1",
	"pytest-cov==7.0.0",
	"ruff==0.16.3",
]

[project.scripts]
geode = "geode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/geode/configs/bufr" = [
	"configs/bufr/table_a_types.yaml",
	"configs/bufr/table_a_subtypes.yaml",
	"configs/bufr/table_a_standard_filenames.yaml",
	"configs/bufr/table_a_local_filenames.yaml",
]

[tool.coverage.run]
source = ["src/geode"]
branch = true

[tool.coverage.report]
exclude_lines = [
	"pragma: no cover",
	"if __name__ == .__main__.:",
]
