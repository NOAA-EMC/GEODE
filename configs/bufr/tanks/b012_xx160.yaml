bufr:
  subsets:
    - NC012160

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    satelliteIdentifier:
      query: "*/SAID"

    # ObsValue
    effcldamtcen:
      query: "*/ECAS"

    effcldamtavg:
      query: "*/ECAM"

  splits:
    satId:
      category:
        variable: satelliteIdentifier

encoder:
  globals:
    - name: "description"
      type: string
      value: "M TYPE 012-160 U.WI GOES Imager Effective Cld Amt data"

    - name: "dataCategory"
      type: string
      value: "surface data from satellite"

    - name: "dataset"
      type: string
      value: "retrieval_cloud_wisc_goes"

    - name: "dataFormat"
      type: string
      value: "BUFR"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "012"

    - name: "bufrLocalSubcategory"
      type: string
      value: "160"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b012/xx160 NC012160"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteIdentifier
      longName: "Satellite Identifier"

    # ObsValue
    - name: "ObsValue/effcldamtcen"
      source: variables/effcldamtcen
      longName: "Satellite Measured Effective Cloud Amount At Center Fo"
      units: "%"

    - name: "ObsValue/effcldamtavg"
      source: variables/effcldamtavg
      longName: "Satellite Measured Effective Cloud Amount Avg MULT. Fo"
      units: "%"
