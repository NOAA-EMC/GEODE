encoder:
  globals:
    - name: "description"
      type: string
      value: "M TYPE 012-122 METOP 50 KM ASCAT scatterometer data"

    - name: "dataCategory"
      type: string
      value: "surface data from satellite"

    - name: "dataset"
      type: string
      value: "retrieval_osw_ascat"

    - name: "dataFormat"
      type: string
      value: "BUFR"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "012"

    - name: "bufrLocalSubcategory"
      type: string
      value: "122"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b012/xx122 NC012122"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
