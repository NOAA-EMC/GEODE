      units: "W m-2 sr-1 m"

    - name: "ObsValue/scaledStandardDeviationOfAvhrrRadiance"
      source: variables/scaledStandardDeviationOfAvhrrRadiance
      longName: "Scaled Standard Deviation Of Avhrr Radiance"
      units: "W m-2 sr-1 m"

    # QualityMarker
    - name: "QualityMarker/instrNoisePerfIndicatorSpectralRadiometric"
      source: variables/instrNoisePerfIndicatorSpectralRadiometric
      longName: "INSTR. Noise PERF. Indicator (SPECTRAL & RADIOMETRIC)"
      units: "%"

    - name: "QualityMarker/geometricQualityIndexIndicator"
      source: variables/geometricQualityIndexIndicator
