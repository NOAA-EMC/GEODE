bufr:
  subsets:
    - NC021241

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    satelliteIdentifier:
      query: "*/SAID"

    generatingCenterLong:
      query: "*/GCLONG"

    instrumentIdentifier1:
      query: "*/SIID[1]"

    satelliteConstellationRO:
      query: "*/SCLF"

    satelliteZenithAngle:
      query: "*/SAZA"

    sensorAzimuthAngle:
      query: "*/BEARAZ"

    solarZenithAngle:
      query: "*/SOZA"

    solarAzimuthAngle:
      query: "*/SOLAZI"

    sensorScanPosition:
      query: "*/FOVN"

    orbitNumber:
      query: "*/ORBN"

    scanLineNumber:
      query: "*/SLNM"

    majorFrameCount:
      query: "*/MJFC"

    stationElevation:
      query: "*/SELV"

    qualityFlags:
      query: "*/QGFQ"

    startChannel1:
      query: "*/IASIL1CB{1}/STCH"

    startChannel2:
      query: "*/IASIL1CB{2}/STCH"

    startChannel3:
      query: "*/IASIL1CB{3}/STCH"

    startChannel4:
      query: "*/IASIL1CB{4}/STCH"

    startChannel5:
      query: "*/IASIL1CB{5}/STCH"

    startChannel6:
      query: "*/IASIL1CB{6}/STCH"

    startChannel7:
      query: "*/IASIL1CB{7}/STCH"

    startChannel8:
      query: "*/IASIL1CB{8}/STCH"

    startChannel9:
      query: "*/IASIL1CB{9}/STCH"

    startChannel10:
      query: "*/IASIL1CB{10}/STCH"

    endChannel1:
      query: "*/IASIL1CB{1}/ENCH"

    endChannel2:
      query: "*/IASIL1CB{2}/ENCH"

    endChannel3:
      query: "*/IASIL1CB{3}/ENCH"

    endChannel4:
      query: "*/IASIL1CB{4}/ENCH"

    endChannel5:
      query: "*/IASIL1CB{5}/ENCH"

    endChannel6:
      query: "*/IASIL1CB{6}/ENCH"

    endChannel7:
      query: "*/IASIL1CB{7}/ENCH"

    endChannel8:
      query: "*/IASIL1CB{8}/ENCH"

    endChannel9:
      query: "*/IASIL1CB{9}/ENCH"

    endChannel10:
      query: "*/IASIL1CB{10}/ENCH"

    channelScaleFactor1:
      query: "*/IASIL1CB{1}/CHSF"

    channelScaleFactor2:
      query: "*/IASIL1CB{2}/CHSF"

    channelScaleFactor3:
      query: "*/IASIL1CB{3}/CHSF"

    channelScaleFactor4:
      query: "*/IASIL1CB{4}/CHSF"

    channelScaleFactor5:
      query: "*/IASIL1CB{5}/CHSF"

    channelScaleFactor6:
      query: "*/IASIL1CB{6}/CHSF"

    channelScaleFactor7:
      query: "*/IASIL1CB{7}/CHSF"

    channelScaleFactor8:
      query: "*/IASIL1CB{8}/CHSF"

    channelScaleFactor9:
      query: "*/IASIL1CB{9}/CHSF"

    channelScaleFactor10:
      query: "*/IASIL1CB{10}/CHSF"

    sensorChannelNumberIasichn:
      query: "*/IASICHN/CHNM"

    instrumentIdentifier2:
      query: "*/SIID[2]"

    avhrrChannelCombination:
      query: "*/AVHCST"

    yAngularPositionOfCenterOfGravity:
      query: "*/IASIL1CS{1}/YAPCG"

    zAngularPositionOfCenterOfGravity:
      query: "*/IASIL1CS{1}/ZAPCG"

    sensorChannelNumberAvhrchn:
      query: "*/IASIL1CS{1}/AVHRCHN/CHNM"

    channelScaleFactor1_2:
      query: "*/IASIL1CS{1}/AVHRCHN/CHSF[1]"

    channelScaleFactor2_2:
      query: "*/IASIL1CS{1}/AVHRCHN/CHSF[2]"

    # ObsValue
    scaledIasiRadiance:
      query: "*/IASICHN/SCRA"

    cloudFree:
      query: "*/IASIL1CS{1}/FCPH"

    scaledMeanAvhrrRadiance:
      query: "*/IASIL1CS{1}/AVHRCHN/SMRA"

    scaledStandardDeviationOfAvhrrRadiance:
      query: "*/IASIL1CS{1}/AVHRCHN/SSDR"

    # QualityMarker
    instrNoisePerfIndicatorSpectralRadiometric:
      query: "*/QGQI"

    geometricQualityIndexIndicator:
      query: "*/QGQIL"

    instrNoisePerfIndicatorRadiometricCalibration:
      query: "*/QGQIR"

    instrumentNoisePerfIndicatorSpectral:
      query: "*/QGQIS"

    outputOfTecFunction:
      query: "*/QGSSQ"

  splits:
    satId:
      category:
        variable: satelliteIdentifier

encoder:
  dimensions:
    - name: Channel
      source: variables/sensorChannelNumberIasichn
      path: "*/IASICHN"
    - name: Avhrchn
      source: variables/sensorChannelNumberAvhrchn
      path: "*/IASIL1CS{1}/AVHRCHN"

  globals:
    - name: "description"
      type: string
      value: "Mtyp 021-241 Iasi 1C Radiances (VARIABLE CHNS) (METOP)"

    - name: "dataCategory"
      type: string
      value: "radiances from satellite"

    - name: "dataset"
      type: string
      value: "radiance_iasi"

    - name: "dataFormat"
      type: string
      value: "BUFR"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "021"

    - name: "bufrLocalSubcategory"
      type: string
      value: "241"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b021/xx241 NC021241"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteIdentifier
      longName: "Satellite Identifier"

    - name: "MetaData/generatingCenterLong"
      source: variables/generatingCenterLong
      longName: "ORIGINATING/GENERATING Center"

    - name: "MetaData/instrumentIdentifier1"
      source: variables/instrumentIdentifier1
      longName: "Satellite Instruments"

    - name: "MetaData/satelliteConstellationRO"
      source: variables/satelliteConstellationRO
      longName: "Satellite Classification"

    - name: "MetaData/satelliteZenithAngle"
      source: variables/satelliteZenithAngle
      longName: "Satellite Zenith Angle"
      units: "degree"

    - name: "MetaData/sensorAzimuthAngle"
      source: variables/sensorAzimuthAngle
      longName: "Bearing Or Azimuth"
      units: "degree"

    - name: "MetaData/solarZenithAngle"
      source: variables/solarZenithAngle
      longName: "Solar Zenith Angle"
      units: "degree"

    - name: "MetaData/solarAzimuthAngle"
      source: variables/solarAzimuthAngle
      longName: "Solar Azimuth"
      units: "degree"

    - name: "MetaData/sensorScanPosition"
      source: variables/sensorScanPosition
      longName: "Field Of View Number"

    - name: "MetaData/orbitNumber"
      source: variables/orbitNumber
      longName: "Orbit Number"

    - name: "MetaData/scanLineNumber"
      source: variables/scanLineNumber
      longName: "Scan Line Number"

    - name: "MetaData/majorFrameCount"
      source: variables/majorFrameCount
      longName: "Major Frame Count"

    - name: "MetaData/stationElevation"
      source: variables/stationElevation
      longName: "Height Of Station"
      units: "m"

    - name: "MetaData/qualityFlags"
      source: variables/qualityFlags
      longName: "Individual IASI-SYSTEM Quality Flag"

    - name: "MetaData/startChannel1"
      source: variables/startChannel1
      longName: "Start Channel (1)"

    - name: "MetaData/startChannel2"
      source: variables/startChannel2
      longName: "Start Channel (2)"

    - name: "MetaData/startChannel3"
      source: variables/startChannel3
      longName: "Start Channel (3)"

    - name: "MetaData/startChannel4"
      source: variables/startChannel4
      longName: "Start Channel (4)"

    - name: "MetaData/startChannel5"
      source: variables/startChannel5
      longName: "Start Channel (5)"

    - name: "MetaData/startChannel6"
      source: variables/startChannel6
      longName: "Start Channel (6)"

    - name: "MetaData/startChannel7"
      source: variables/startChannel7
      longName: "Start Channel (7)"

    - name: "MetaData/startChannel8"
      source: variables/startChannel8
      longName: "Start Channel (8)"

    - name: "MetaData/startChannel9"
      source: variables/startChannel9
      longName: "Start Channel (9)"

    - name: "MetaData/startChannel10"
      source: variables/startChannel10
      longName: "Start Channel (10)"

    - name: "MetaData/endChannel1"
      source: variables/endChannel1
      longName: "End Channel (1)"

    - name: "MetaData/endChannel2"
      source: variables/endChannel2
      longName: "End Channel (2)"

    - name: "MetaData/endChannel3"
      source: variables/endChannel3
      longName: "End Channel (3)"

    - name: "MetaData/endChannel4"
      source: variables/endChannel4
      longName: "End Channel (4)"

    - name: "MetaData/endChannel5"
      source: variables/endChannel5
      longName: "End Channel (5)"

    - name: "MetaData/endChannel6"
      source: variables/endChannel6
      longName: "End Channel (6)"

    - name: "MetaData/endChannel7"
      source: variables/endChannel7
      longName: "End Channel (7)"

    - name: "MetaData/endChannel8"
      source: variables/endChannel8
      longName: "End Channel (8)"

    - name: "MetaData/endChannel9"
      source: variables/endChannel9
      longName: "End Channel (9)"

    - name: "MetaData/endChannel10"
      source: variables/endChannel10
      longName: "End Channel (10)"

    - name: "MetaData/channelScaleFactor1"
      source: variables/channelScaleFactor1
      longName: "Channel Scale Factor (1)"

    - name: "MetaData/channelScaleFactor2"
      source: variables/channelScaleFactor2
      longName: "Channel Scale Factor (2)"

    - name: "MetaData/channelScaleFactor3"
      source: variables/channelScaleFactor3
      longName: "Channel Scale Factor (3)"

    - name: "MetaData/channelScaleFactor4"
      source: variables/channelScaleFactor4
      longName: "Channel Scale Factor (4)"

    - name: "MetaData/channelScaleFactor5"
      source: variables/channelScaleFactor5
      longName: "Channel Scale Factor (5)"

    - name: "MetaData/channelScaleFactor6"
      source: variables/channelScaleFactor6
      longName: "Channel Scale Factor (6)"

    - name: "MetaData/channelScaleFactor7"
      source: variables/channelScaleFactor7
      longName: "Channel Scale Factor (7)"

    - name: "MetaData/channelScaleFactor8"
      source: variables/channelScaleFactor8
      longName: "Channel Scale Factor (8)"

    - name: "MetaData/channelScaleFactor9"
      source: variables/channelScaleFactor9
      longName: "Channel Scale Factor (9)"

    - name: "MetaData/channelScaleFactor10"
      source: variables/channelScaleFactor10
      longName: "Channel Scale Factor (10)"

    - name: "MetaData/sensorChannelNumberIasichn"
      source: variables/sensorChannelNumberIasichn
      longName: "Channel Number"

    - name: "MetaData/instrumentIdentifier2"
      source: variables/instrumentIdentifier2
      longName: "Satellite Instruments"

    - name: "MetaData/avhrrChannelCombination"
      source: variables/avhrrChannelCombination
      longName: "Avhrr Channel Combination"

    - name: "MetaData/yAngularPositionOfCenterOfGravity"
      source: variables/yAngularPositionOfCenterOfGravity
      longName: "Y Angular Position Of Center Of Gravity"
      units: "degree"

    - name: "MetaData/zAngularPositionOfCenterOfGravity"
      source: variables/zAngularPositionOfCenterOfGravity
      longName: "Z Angular Position Of Center Of Gravity"
      units: "degree"

    - name: "MetaData/sensorChannelNumberAvhrchn"
      source: variables/sensorChannelNumberAvhrchn
      longName: "Channel Number"

    - name: "MetaData/channelScaleFactor1_2"
      source: variables/channelScaleFactor1_2
      longName: "Channel Scale Factor"

    - name: "MetaData/channelScaleFactor2_2"
      source: variables/channelScaleFactor2_2
      longName: "Channel Scale Factor"

    # ObsValue
    - name: "ObsValue/scaledIasiRadiance"
      source: variables/scaledIasiRadiance
      longName: "Scaled Iasi Radiance"
      units: "W m-2 sr-1 m"

    - name: "ObsValue/cloudFree"
      source: variables/cloudFree
