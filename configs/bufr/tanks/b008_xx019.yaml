bufr:
  subsets:
    - NC008019

  variables:
    # Not mapped: see the sequence notes in dev/ush/generate_bufr_tank_yamls.py
    #   */RPSEQ3/DPRI

    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    satelliteIdentifier:
      query: "*/SAID"

    dataProviderOrigin:
      query: "*/OGCE"

    generatingSubCenter:
      query: "*/GSES"

    instrumentIdentifier:
      query: "*/SIID"

    satelliteConstellationRO:
      query: "*/SCLF"

    orbitNumber:
      query: "*/ORBN"

    satelliteZenithAngle:
      query: "*/SAZA"

    sensorAzimuthAngle:
      query: "*/BEARAZ"

    solarZenithAngle:
      query: "*/SOZA"

    solarAzimuthAngle:
      query: "*/SOLAZI"

    heightOfStation:
      query: "*/OLPDTSQ/HMSL"

    ozoneProfileComputationMethodOzdsq1:
      query: "*/OLPDTSQ/OZDSQ{1}/OPCM"

    ozoneProfileComputationMethodOzdsq2:
      query: "*/OLPDTSQ/OZDSQ{2}/OPCM"

    ozoneProfileComputationMethodOlpdtsq:
      query: "*/OLPDTSQ/OPCM"

    decimalScaleOfFollowingValues1:
      query: "*/OLPDTSQ/DSFTV[1]"

    decimalScaleOfFollowingValues2:
      query: "*/OLPDTSQ/DSFTV[2]"

    qualityInfoForLog10OfNumberDensityOfOzone1:
      query: "*/QMRKHSQ/QMLTNDO[1]"

    qualityInfoForLog10OfNumberDensityOfOzone2:
      query: "*/QMRKHSQ/QMLTNDO[2]"

    qualityInfoForVolumetricMixingRatioSignficand:
      query: "*/QMRKHSQ/QMMIXRV"

    firstOrderStatistics:
      query: "*/FOST"

    standardDeviationOfLog10OfNumberDensityOfOzone1:
      query: "*/LPSDVALS/LTNDOSD[1]"

    standardDeviationOfLog10OfNumberDensityOfOzone2:
      query: "*/LPSDVALS/LTNDOSD[2]"

    standardDeviationOfVolumetricMixingRatio:
      query: "*/LPSDVALS/MIXRVSD"

    # ObsValue
    airPressure:
      query: "*/OLPDTSQ/PRES"

    log10OfNumberDensityOfAtmosphere:
      query: "*/OLPDTSQ/LTNDA"

    airTemperature:
      query: "*/OLPDTSQ/TMDBST"

    log10OfNumberDensityOfOzone1:
      query: "*/OLPDTSQ/OZDSQ{1}/LTNDO"

    log10OfNumberDensityOfOzone2:
      query: "*/OLPDTSQ/OZDSQ{2}/LTNDO"

    scaledSignificandOfVolumetricMixingRatio:
      query: "*/OLPDTSQ/MIXRV"

  splits:
    satId:
      category:
        variable: satelliteIdentifier

encoder:
  dimensions:
    - name: Lpsdvals
      path: "*/LPSDVALS"
    - name: Olpdtsq
      path: "*/OLPDTSQ"
    - name: Qmrkhsq
      path: "*/QMRKHSQ"

  globals:
    - name: "description"
      type: string
      value: "Omps Limb Profiler Ozone Product Data"

    - name: "dataCategory"
      type: string
      value: "physical / chemical constituents"

    - name: "dataset"
      type: string
      value: "retrieval_ozone_omps-lp"

    - name: "dataFormat"
      type: string
      value: "BUFR"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "008"

    - name: "bufrLocalSubcategory"
      type: string
      value: "019"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b008/xx019 NC008019"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteIdentifier
      longName: "Satellite Identifier *"

    - name: "MetaData/dataProviderOrigin"
      source: variables/dataProviderOrigin
      longName: "Identification Of ORIGINATING/GENERATING Center"

    - name: "MetaData/generatingSubCenter"
      source: variables/generatingSubCenter
      longName: "Identification Of ORIGINATING/GENERATING SUB-CENTER"

    - name: "MetaData/instrumentIdentifier"
      source: variables/instrumentIdentifier
      longName: "Satellite Instruments"

    - name: "MetaData/satelliteConstellationRO"
      source: variables/satelliteConstellationRO
      longName: "Satellite Classification"

    - name: "MetaData/orbitNumber"
      source: variables/orbitNumber
      longName: "Orbit Number"

    - name: "MetaData/satelliteZenithAngle"
      source: variables/satelliteZenithAngle
      longName: "Satellite Zenith Angle"
      units: "degree"

    - name: "MetaData/sensorAzimuthAngle"
      source: variables/sensorAzimuthAngle
      longName: "Bearing Or Azimuth"
      units: "degree"

    - name: "MetaData/solarZenithAngle"
      source: variables/solarZenithAngle
      longName: "Solar Zenith Angle"
      units: "degree"

    - name: "MetaData/solarAzimuthAngle"
      source: variables/solarAzimuthAngle
      longName: "Solar Azimuth Angle"
      units: "degree"

    - name: "MetaData/heightOfStation"
      source: variables/heightOfStation
      longName: "Height Or Altitude"
      units: "m"

    - name: "MetaData/ozoneProfileComputationMethodOzdsq1"
      source: variables/ozoneProfileComputationMethodOzdsq1
      longName: "Ozone Profile Computation Method (1)"

    - name: "MetaData/ozoneProfileComputationMethodOzdsq2"
      source: variables/ozoneProfileComputationMethodOzdsq2
      longName: "Ozone Profile Computation Method (2)"

    - name: "MetaData/ozoneProfileComputationMethodOlpdtsq"
      source: variables/ozoneProfileComputationMethodOlpdtsq
      longName: "Ozone Profile Computation Method"

    - name: "MetaData/decimalScaleOfFollowingValues1"
      source: variables/decimalScaleOfFollowingValues1
      longName: "Decimal Scale Of Following Values"

    - name: "MetaData/decimalScaleOfFollowingValues2"
      source: variables/decimalScaleOfFollowingValues2
      longName: "Decimal Scale Of Following Values"

    - name: "MetaData/qualityInfoForLog10OfNumberDensityOfOzone1"
      source: variables/qualityInfoForLog10OfNumberDensityOfOzone1
      longName: "Quality Info for LOG10 OF NUMBER DENSITY OF OZONE"

    - name: "MetaData/qualityInfoForLog10OfNumberDensityOfOzone2"
      source: variables/qualityInfoForLog10OfNumberDensityOfOzone2
      longName: "Quality Info for LOG10 OF NUMBER DENSITY OF OZONE"

    - name: "MetaData/qualityInfoForVolumetricMixingRatioSignficand"
      source: variables/qualityInfoForVolumetricMixingRatioSignficand
      longName: "Quality Info for VOLUMETRIC MIXING RATIO SIGNFICAND"

    - name: "MetaData/firstOrderStatistics"
      source: variables/firstOrderStatistics
      longName: "FIRST-ORDER Statistics"

    - name: "MetaData/standardDeviationOfLog10OfNumberDensityOfOzone1"
      source: variables/standardDeviationOfLog10OfNumberDensityOfOzone1
      longName: "Standard Deviation Of LOG10 Of Number Density Of Ozone"
      units: "log(m-3)"

    - name: "MetaData/standardDeviationOfLog10OfNumberDensityOfOzone2"
      source: variables/standardDeviationOfLog10OfNumberDensityOfOzone2
      longName: "Standard Deviation Of LOG10 Of Number Density Of Ozone"
      units: "log(m-3)"

    - name: "MetaData/standardDeviationOfVolumetricMixingRatio"
      source: variables/standardDeviationOfVolumetricMixingRatio
      longName: "Standard Deviation Of Volumetric Mixing Ratio Signfica"

    # ObsValue
    - name: "ObsValue/airPressure"
      source: variables/airPressure
      longName: "Terrain Pressure"
      units: "Pa"

    - name: "ObsValue/log10OfNumberDensityOfAtmosphere"
      source: variables/log10OfNumberDensityOfAtmosphere
      longName: "LOG10 Of Number Density Of Atmosphere"
      units: "log(m-3)"

    - name: "ObsValue/airTemperature"
      source: variables/airTemperature
      longName: "TEMPERATURE/AIR Temperature"
      units: "K"

    - name: "ObsValue/log10OfNumberDensityOfOzone1"
      source: variables/log10OfNumberDensityOfOzone1
      longName: "LOG10 Of Number Density Of Ozone (1)"
      units: "log(m-3)"

    - name: "ObsValue/log10OfNumberDensityOfOzone2"
      source: variables/log10OfNumberDensityOfOzone2
      longName: "LOG10 Of Number Density Of Ozone (2)"
      units: "log(m-3)"

    - name: "ObsValue/scaledSignificandOfVolumetricMixingRatio"
      source: variables/scaledSignificandOfVolumetricMixingRatio
      longName: "Scaled (SIGNIFICAND OF) Volumetric Mixing Ratio"
