encoder:
  globals:
    - name: "description"
      type: string
      value: "031-124 CNES/NESDIS JASON-3 Ogdr Altm Ssha W/W H-RS Gbl"

    - name: "dataCategory"
      type: string
      value: "oceanographic data"

    - name: "dataset"
      type: string
      value: "marine_altimeter_jason3"

    - name: "dataFormat"
      type: string
      value: "BUFR"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "031"

    - name: "bufrLocalSubcategory"
      type: string
      value: "124"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b031/xx124 NC031124"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteIdentifier
      longName: "Satellite Identifier"

    - name: "MetaData/instrumentIdentifier"
      source: variables/instrumentIdentifier
      longName: "Satellite instruments"

    - name: "MetaData/stationAcquisition"
      source: variables/stationAcquisition
      longName: "Station acquisition"

    - name: "MetaData/softwareVersion"
      source: variables/softwareVersion
      longName: "Software identification and version number"

    - name: "MetaData/satelliteCycleNumber"
      source: variables/satelliteCycleNumber
      longName: "Satellite Cycle Number"

    - name: "MetaData/orbitNumber"
      source: variables/orbitNumber
      longName: "Orbit Number"

    - name: "MetaData/numericalModelIdentifier"
      source: variables/numericalModelIdentifier
