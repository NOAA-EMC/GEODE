    rmsOfCBandOceanRange:
      query: "*/RCBOR"

    numberOf20HzValidPointsForCBand:
      query: "*/NVPC"

    cBandSignificantWaveHeight:
      query: "*/CBSW"

    rms20HzCBandSignificantWaveHeight:
