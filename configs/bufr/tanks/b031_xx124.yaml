    totalGeocentricOceanTideHeightSolution2:
      query: "*/TGOTH2"

    loadingTideHeightGeocentricOceanTideSolution1:
      query: "*/LTHS1"

    loadingTideHeightGeocentricOceanTideSolution2:
      query: "*/LTHS2"

    longPeriodTideHeight:
