      query: "*/CNIA"

    attenuationCorrectionOnSigma02:
      query: "*/ACRS[2]"

    cBandAutomaticGainControl:
      query: "*/CAGC"

    rmsCBandAutomaticGainControl:
      query: "*/RCAGC"

    numberOfValidPointsForCBandAutomaticGain:
      query: "*/NVPCA"

    brightnessTemperature1:
      query: "*/TMBRST[1]"

    brightnessTemperature2:
      query: "*/TMBRST[2]"

    brightnessTemperature3:
      query: "*/TMBRST[3]"

    radiometerWaterVaporContent:
      query: "*/RWVC"

    radiometerLiquidContent:
      query: "*/RLQC"

    windSpeedFromAltimeter:
