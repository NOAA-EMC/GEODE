    icePresenceIndicator:
      query: "*/IPIN"

    auxilliaryAltimeterStateFlags:
      query: "*/AASF"

    meteorologicalMapAvailability:
      query: "*/MMAC"

    interpolationFlagForMeanDiurnalTide:
