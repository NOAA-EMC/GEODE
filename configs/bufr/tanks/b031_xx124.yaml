bufr:
  subsets:
    - NC031124

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECW"

    receiptTime:
      datetime:
        year: "*/RCYR"
        month: "*/RCMO"
        day: "*/RCDY"
        hour: "*/RCHR"
        minute: "*/RCMI"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    satelliteIdentifier:
      query: "*/SAID"

    instrumentIdentifier:
      query: "*/SIID"

    stationAcquisition:
      query: "*/STAQ"

    softwareVersion:
      query: "*/SOFTV"

    satelliteCycleNumber:
      query: "*/SACYLN"

    orbitNumber:
      query: "*/ORBN"

    numericalModelIdentifier:
      query: "*/NUMID"

    secondWithinAMinuteMicrosecondAccuracy:
      query: "*/SECW"

    remotelySensedSurfaceType:
      query: "*/RSST"

    altimeterEchoType:
      query: "*/AETP"

    radiometerSensedSurfaceType:
      query: "*/DSST"

    v3DErrorEstimateOfTheNavigatorOrbit:
      query: "*/EENO"

    altimeterStateFlag:
      query: "*/ASFL"

    altimeterDataQualityFlag:
      query: "*/ADQF"

    altimeterCorrectionQualityFlag:
      query: "*/ARQF"

    radiometerStateFlag:
      query: "*/RSFL"

    kuBandNetInstrumentalCorrection:
      query: "*/KBIC"

    seaStateBiasCorrectionOnKuBand:
      query: "*/SBCK"

    cBandNetInstrumentalCorrection:
      query: "*/CBIC"

    seaStateBiasCorrectionOnCBand:
