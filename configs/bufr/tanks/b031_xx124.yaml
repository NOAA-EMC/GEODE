    waveHeight:
      query: "*/ABSENT"
      type: float

    standardDeviationOfSignificantWaveHeight:
      query: "*/ABSENT"
      type: float

    altitudePlatformToEllipsoid:
      query: "*/ABSENT"
      type: float

    peakiness:
      query: "*/ABSENT"
      type: int

    altimeterCorrectionIonosphere:
      query: "*/ABSENT"
      type: float

    altimeterCorrectionDryTroposphere:
      query: "*/ABSENT"
      type: float

    altimeterCorrectionWetTroposphere:
      query: "*/ABSENT"
      type: float

    openLoopCorrectionAutoGainControl:
      query: "*/ABSENT"
      type: float

    backscatter:
      query: "*/ABSENT"
