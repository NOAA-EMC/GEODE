bufr:
  subsets:
    - NC005099

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    windComputationMethod:
      query: "*/SWCM"

    pressure:
      query: "*/PRLC"

    windGeneratingApplication:
      query: "*/GNAPS"

    dataProviderOrigin:
      query: "*/OGCE"

    qiWithoutForecast:
      query: "*/PCCF"

    satelliteIdentifier:
      query: "*/SAID"

    # ObsValue
    windSpeed:
      query: "*/WSPD"

    windDirection:
      query: "*/WDIR"

  splits:
    satId:
      category:
        variable: satelliteIdentifier

encoder:
  globals:
    - name: "description"
      type: string
      value: "Msg Type 005-099 Cimss Amv Tropical Cyclone Winds"

    - name: "dataCategory"
      type: string
      value: "single level upper-air data from satellite"

    - name: "dataset"
      type: string
      value: "retrieval_amv_abi-meso"

    - name: "dataFormat"
      type: string
      value: "ASCII"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "005"

    - name: "bufrLocalSubcategory"
      type: string
      value: "099"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b005/xx099 NC005099"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/windComputationMethod"
      source: variables/windComputationMethod
      longName: "Satellite Derived Wind Calculation Method"

    - name: "MetaData/pressure"
      source: variables/pressure
      longName: "Pressure"
      units: "Pa"

    - name: "MetaData/windGeneratingApplication"
      source: variables/windGeneratingApplication
      longName: "Standard generating application"

    - name: "MetaData/dataProviderOrigin"
      source: variables/dataProviderOrigin
      longName: "ORIGINATING/GENERATING Center"

    - name: "MetaData/qiWithoutForecast"
      source: variables/qiWithoutForecast
      longName: "Percent Confidence"
      units: "%"

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteIdentifier
      longName: "Satellite Identifier"

    # ObsValue
    - name: "ObsValue/windSpeed"
      source: variables/windSpeed
      longName: "Wind Speed"
      units: "m s-1"

    - name: "ObsValue/windDirection"
      source: variables/windDirection
      longName: "Wind Direction"
      units: "degree"
