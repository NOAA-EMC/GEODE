encoder:
  dimensions:
    - name: RawReportChunk
      path: "*/RAWRPT"

  globals:
    - name: "description"
      type: string
      value: "Message Type 001-007 Surface Marine Coast Guard Station"

    - name: "dataCategory"
      type: string
      value: "surface marine"

    - name: "dataset"
      type: string
      value: "surface_uscg"

    - name: "dataFormat"
      type: string
      value: "ASCII"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "001"

    - name: "bufrLocalSubcategory"
      type: string
      value: "007"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b001/xx007 NC001007"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/stationIdentification"
      source: variables/stationIdentification
      longName: "Report Identifier"

    - name: "MetaData/shipCallSign"
      source: variables/shipCallSign
      longName: "Ship Call Sign (8 CHARACTERS)"

    - name: "MetaData/buoyPlatformIdentifier"
      source: variables/buoyPlatformIdentifier
      longName: "BUOY/PLATFORM Identifier"

    - name: "MetaData/stationaryBuoyIdentifier"
      source: variables/stationaryBuoyIdentifier
      longName: "Stationary Buoy Platform Id"

    - name: "MetaData/stationElevation"
      source: variables/stationElevation
      longName: "Height Of Station"
      units: "m"

    - name: "MetaData/sequenceNumber"
      source: variables/sequenceNumber
      longName: "Channel Sequence Number"

    - name: "MetaData/bulletinHeader"
      source: variables/bulletinHeader
      longName: "BULLETIN BEING MONITORED (TTAAii)"

    - name: "MetaData/bulletinOriginator"
      source: variables/bulletinOriginator
      longName: "Bulletin Being Monitored (CCCC)"

    - name: "MetaData/bulletinTime"
      source: variables/bulletinTime
      longName: "BULLETIN BEING MONITORED (YYGGgg)"

    - name: "MetaData/bulletinBBB"
      source: variables/bulletinBBB
      longName: "Bulletin Being Monitored (BBB)"

    - name: "MetaData/receiptTimeSignificance"
      source: variables/receiptTimeSignificance
      longName: "Receipt Time Significance"

    - name: "MetaData/windInstrumentationType"
      source: variables/windInstrumentationType
      longName: "Type Of Instrumentation For Wind Measurement"

    - name: "MetaData/methodOfSeaSurfaceTemperatureMeasurement"
      source: variables/methodOfSeaSurfaceTemperatureMeasurement
      longName: "Method Of Sea Surface Temperature Measurement"

    - name: "MetaData/methodOfWetBulbTemperatureMeasurement"
