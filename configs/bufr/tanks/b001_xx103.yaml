encoder:
  dimensions:
    # Variable length: appending can fail if the size changes
    - name: Bbycurr
      path: "*/MOCMDBDS/BBYCURR"
    # Variable length: appending can fail if the size changes
    - name: Bbyspwv
      path: "*/SPCTRWAV/BBYSPWV"

  globals:
    - name: "description"
      type: string
      value: "Message Type 001-103 Surface Marine Moored Buoy (BUFR)"

    - name: "dataCategory"
      type: string
      value: "surface marine"

    - name: "dataset"
      type: string
      value: "surface_buoy_moored_bufr"

    - name: "dataFormat"
      type: string
      value: "BUFR"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "001"

    - name: "bufrLocalSubcategory"
      type: string
      value: "103"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b001/xx103 NC001103"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/stationIdentification"
      source: variables/stationIdentification
      longName: "Report Identifier"

    - name: "MetaData/wmoRegionNumber"
      source: variables/wmoRegionNumber
      longName: "Wmo Region Number"

    - name: "MetaData/wmoRegionSubArea"
      source: variables/wmoRegionSubArea
      longName: "WMO Region sub-area"

    - name: "MetaData/buoyPlatformIdentifier"
      source: variables/buoyPlatformIdentifier
      longName: "BUOY/PLATFORM Identifier"

    - name: "MetaData/wigosIdentifierSeries"
      source: variables/wigosIdentifierSeries
      longName: "Wigos Identifier Series"

    - name: "MetaData/wigosIssuerOfIdentifier"
      source: variables/wigosIssuerOfIdentifier
      longName: "Wigos Issuer Of Identifier"

    - name: "MetaData/wigosIssueNumber"
      source: variables/wigosIssueNumber
      longName: "Wigos Issue Number"

    - name: "MetaData/wigosLocalIdentifierCharacter"
      source: variables/wigosLocalIdentifierCharacter
      longName: "Wigos Local Identifier (CHARACTER)"

    - name: "MetaData/wmoMarineObservingPlatformExtendedIdentifier"
      source: variables/wmoMarineObservingPlatformExtendedIdentifier
      longName: "WMO marine observing platform extended identifier"

    - name: "MetaData/stationName"
      source: variables/stationName
      longName: "Station or site name"

    - name: "MetaData/buoyType"
      source: variables/buoyType
      longName: "Buoy Type"

    - name: "MetaData/stationElevation"
      source: variables/stationElevation
      longName: "Height Of Station Ground Above Msl"
      units: "m"

    - name: "MetaData/heightOfSensorAboveWater1"
      source: variables/heightOfSensorAboveWater1
      longName: "Height of sensor above water surface"
      units: "m"

    - name: "MetaData/heightOfSensorAboveWater2"
      source: variables/heightOfSensorAboveWater2
      longName: "Height of sensor above water surface"
      units: "m"

    - name: "MetaData/timeSignificance1"
      source: variables/timeSignificance1
      longName: "Time Significance"

    - name: "MetaData/timePeriodMinutes1"
      source: variables/timePeriodMinutes1
      longName: "Time Period Or Displacement"
      units: "min"

    - name: "MetaData/timeSignificance2"
      source: variables/timeSignificance2
      longName: "Time Significance"

    - name: "MetaData/timePeriodMinutes2"
      source: variables/timePeriodMinutes2
      longName: "Time Period Or Displacement"
      units: "min"

    - name: "MetaData/timePeriodMinutes3"
      source: variables/timePeriodMinutes3
      longName: "Time Period Or Displacement"
      units: "min"

    - name: "MetaData/heightOfSensorAboveWater3"
      source: variables/heightOfSensorAboveWater3
      longName: "Height of sensor above water surface"
      units: "m"

    - name: "MetaData/precisionOfTemperatureObservation"
      source: variables/precisionOfTemperatureObservation
      longName: "Precision of temperature observation"
      units: "K"

    - name: "MetaData/depthBelowSeaWaterSurfaceCm"
      source: variables/depthBelowSeaWaterSurfaceCm
