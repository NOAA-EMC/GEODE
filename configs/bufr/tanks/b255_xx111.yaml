bufr:
  subsets:
    - NC255111

  variables:
    # Not mapped: see the sequence notes in dev/ush/generate_bufr_tank_yamls.py
    #   */FILENAME/FNSTG

    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"

    receiptTime:
      datetime:
        year: "*/RCPTIM{1}/RCYR"
        month: "*/RCPTIM{1}/RCMO"
        day: "*/RCPTIM{1}/RCDY"
        hour: "*/RCPTIM{1}/RCHR"
        minute: "*/RCPTIM{1}/RCMI"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    receiptTimeSignificance:
      query: "*/RCPTIM{1}/RCTS"

    restrictionFlag:
      query: "*/RSRD"

    restrictionExpiration:
      query: "*/EXPRSRD"

    stationIdentification:
      query: "*/RPID"

    providerIdentifier1:
      query: "*/PRVID{1}/PRVSTG"

    providerIdentifier2:
      query: "*/PRVID{2}/PRVSTG"

    platformType:
      query: "*/PLTTYP"

    stationElevation:
      query: "*/SELV"

    timePeriodHours1:
      query: "*/CNTOPCSQ{1}/TPHR"

    timePeriodHours2:
      query: "*/CNTOPCSQ{2}/TPHR"

    timePeriodHours3:
      query: "*/CNTOPCSQ{3}/TPHR"

    timePeriodHours4:
      query: "*/CNTOPCSQ{4}/TPHR"

    timePeriodMinutes1:
      query: "*/CNTOPCSQ{1}/TPMI"

    timePeriodMinutes2:
      query: "*/CNTOPCSQ{2}/TPMI"

    timePeriodMinutes3:
      query: "*/CNTOPCSQ{3}/TPMI"

    timePeriodMinutes4:
      query: "*/CNTOPCSQ{4}/TPMI"

    depthBelowLandSurface1:
      query: "*/MNSOMTSQ{1}/DBLS"

    depthBelowLandSurface2:
      query: "*/MNSOMTSQ{2}/DBLS"

    # ObsValue
    airTemperatureTMDB:
      query: "*/MNTMDBSQ/TMDB"

    relativeHumidity:
      query: "*/MNREHUSQ/REHU"

    windDirection:
      query: "*/MNWDIRSQ/WDIR"

    windSpeed:
      query: "*/MNWSPDSQ/WSPD"

    maximumWindGustDirection:
      query: "*/MNGUSTSQ/MXGD"

    maximumWindGustSpeed:
      query: "*/MNGUSTSQ/MXGS"

    solarRadiationFlux:
      query: "*/MNSORFSQ/SRADF"

    rainfallWaterEquivalentOfSnowAveragedRate:
      query: "*/MNREQVSQ/REQV"

    totalPrecipitation1:
      query: "*/CNTOPCSQ{1}/TOPC"

    totalPrecipitation2:
      query: "*/CNTOPCSQ{2}/TOPC"

    totalPrecipitation3:
      query: "*/CNTOPCSQ{3}/TOPC"

    totalPrecipitation4:
      query: "*/CNTOPCSQ{4}/TOPC"

    soilMoistureAvailability1:
      query: "*/MNSOMTSQ{1}/WTNS"

    soilMoistureAvailability2:
      query: "*/MNSOMTSQ{2}/WTNS"

    soilTemperature1:
      query: "*/MNSOMTSQ{1}/STEMH"

    soilTemperature2:
      query: "*/MNSOMTSQ{2}/STEMH"

    # QualityMarker
    fslQcDataMntmdbsq:
      query: "*/MNTMDBSQ/QCD"

    fslQcAppliedMntmdbsq:
      query: "*/MNTMDBSQ/QCA"

    fslQcResultsMntmdbsq:
      query: "*/MNTMDBSQ/QCR"

    airTemperature:
      query: "*/QMAT"

    fslQcDataMnrehusq:
      query: "*/MNREHUSQ/QCD"

    fslQcAppliedMnrehusq:
      query: "*/MNREHUSQ/QCA"

    fslQcResultsMnrehusq:
      query: "*/MNREHUSQ/QCR"

    moisture:
      query: "*/QMDD"

    fslQcDataMnwdirsq:
      query: "*/MNWDIRSQ/QCD"

    fslQcAppliedMnwdirsq:
      query: "*/MNWDIRSQ/QCA"

    fslQcResultsMnwdirsq:
      query: "*/MNWDIRSQ/QCR"

    fslQcDataMnwspdsq:
      query: "*/MNWSPDSQ/QCD"

    fslQcAppliedMnwspdsq:
      query: "*/MNWSPDSQ/QCA"

    fslQcResultsMnwspdsq:
      query: "*/MNWSPDSQ/QCR"

    wind:
      query: "*/QMWN"

    fslQcDataMnsorfsq:
      query: "*/MNSORFSQ/QCD"

    fslQcAppliedMnsorfsq:
      query: "*/MNSORFSQ/QCA"

    fslQcResultsMnsorfsq:
      query: "*/MNSORFSQ/QCR"

    fslQcDataMnreqvsq:
      query: "*/MNREQVSQ/QCD"

    fslQcAppliedMnreqvsq:
      query: "*/MNREQVSQ/QCA"

    fslQcResultsMnreqvsq:
      query: "*/MNREQVSQ/QCR"

    fslQcDataCntopcsq1:
      query: "*/CNTOPCSQ{1}/QCD"

    fslQcDataCntopcsq2:
      query: "*/CNTOPCSQ{2}/QCD"

    fslQcDataCntopcsq3:
      query: "*/CNTOPCSQ{3}/QCD"

    fslQcDataCntopcsq4:
      query: "*/CNTOPCSQ{4}/QCD"

    fslQcAppliedCntopcsq1:
      query: "*/CNTOPCSQ{1}/QCA"

    fslQcAppliedCntopcsq2:
      query: "*/CNTOPCSQ{2}/QCA"

    fslQcAppliedCntopcsq3:
      query: "*/CNTOPCSQ{3}/QCA"

    fslQcAppliedCntopcsq4:
      query: "*/CNTOPCSQ{4}/QCA"

    fslQcResultsCntopcsq1:
      query: "*/CNTOPCSQ{1}/QCR"

    fslQcResultsCntopcsq2:
      query: "*/CNTOPCSQ{2}/QCR"

    fslQcResultsCntopcsq3:
      query: "*/CNTOPCSQ{3}/QCR"

    fslQcResultsCntopcsq4:
      query: "*/CNTOPCSQ{4}/QCR"

    fslQcData11:
      query: "*/MNSOMTSQ{1}/QCD[1]"

    fslQcData12:
      query: "*/MNSOMTSQ{2}/QCD[1]"

    fslQcApplied11:
      query: "*/MNSOMTSQ{1}/QCA[1]"

    fslQcApplied12:
      query: "*/MNSOMTSQ{2}/QCA[1]"

    fslQcResults11:
      query: "*/MNSOMTSQ{1}/QCR[1]"

    fslQcResults12:
      query: "*/MNSOMTSQ{2}/QCR[1]"

    fslQcData21:
      query: "*/MNSOMTSQ{1}/QCD[2]"

    fslQcData22:
      query: "*/MNSOMTSQ{2}/QCD[2]"

    fslQcApplied21:
      query: "*/MNSOMTSQ{1}/QCA[2]"

    fslQcApplied22:
      query: "*/MNSOMTSQ{2}/QCA[2]"

    fslQcResults21:
