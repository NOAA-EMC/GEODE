encoder:
  globals:
    - name: "description"
      type: string
      value: "MTYP 255-111 Mesonet from MADIS: Climate Refrnce Netwk"

    - name: "dataCategory"
      type: string
      value: "other"

    - name: "dataset"
      type: string
      value: "mesonet_madis_crn"

    - name: "dataFormat"
      type: string
      value: "netCDF"

    - name: "restricted"
      type: string
      value: "true"

    - name: "bufrCategory"
      type: string
      value: "255"

    - name: "bufrLocalSubcategory"
      type: string
      value: "111"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b255/xx111 NC255111"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/receiptTimeSignificance"
      source: variables/receiptTimeSignificance
      longName: "Receipt Time Significance"

    - name: "MetaData/restrictionFlag"
      source: variables/restrictionFlag
      longName: "Restrictions On Redistribution"

    - name: "MetaData/restrictionExpiration"
      source: variables/restrictionExpiration
      longName: "Expiration Of Restrictions On Redistribution"
      units: "h"

    - name: "MetaData/stationIdentification"
      source: variables/stationIdentification
      longName: "Report Identifier"

    - name: "MetaData/providerIdentifier1"
      source: variables/providerIdentifier1
      longName: "Mesonet Provider Id String (1)"

    - name: "MetaData/providerIdentifier2"
      source: variables/providerIdentifier2
      longName: "Mesonet Provider Id String (2)"

    - name: "MetaData/platformType"
      source: variables/platformType
      longName: "Platform Type"

    - name: "MetaData/stationElevation"
      source: variables/stationElevation
      longName: "Height Of Station"
      units: "m"

    - name: "MetaData/timePeriodHours1"
      source: variables/timePeriodHours1
      longName: "Time Period Or Displacement (1)"
      units: "h"

    - name: "MetaData/timePeriodHours2"
      source: variables/timePeriodHours2
      longName: "Time Period Or Displacement (2)"
      units: "h"

    - name: "MetaData/timePeriodHours3"
      source: variables/timePeriodHours3
      longName: "Time Period Or Displacement (3)"
      units: "h"

    - name: "MetaData/timePeriodHours4"
      source: variables/timePeriodHours4
      longName: "Time Period Or Displacement (4)"
      units: "h"

    - name: "MetaData/timePeriodMinutes1"
      source: variables/timePeriodMinutes1
      longName: "Time Period Or Displacement (1)"
      units: "min"

    - name: "MetaData/timePeriodMinutes2"
      source: variables/timePeriodMinutes2
      longName: "Time Period Or Displacement (2)"
      units: "min"

    - name: "MetaData/timePeriodMinutes3"
      source: variables/timePeriodMinutes3
      longName: "Time Period Or Displacement (3)"
      units: "min"

    - name: "MetaData/timePeriodMinutes4"
      source: variables/timePeriodMinutes4
      longName: "Time Period Or Displacement (4)"
      units: "min"

    - name: "MetaData/depthBelowLandSurface1"
      source: variables/depthBelowLandSurface1
      longName: "Depth Below Land Surface (1)"
      units: "m"

    - name: "MetaData/depthBelowLandSurface2"
      source: variables/depthBelowLandSurface2
      longName: "Depth Below Land Surface (2)"
      units: "m"

    # ObsValue
    - name: "ObsValue/airTemperatureTMDB"
      source: variables/airTemperatureTMDB
      longName: "TEMPERATURE/DRY Bulb Temperature"
      units: "K"

    - name: "ObsValue/relativeHumidity"
      source: variables/relativeHumidity
      longName: "Relative Humidity"
      units: "%"

    - name: "ObsValue/windDirection"
      source: variables/windDirection
      longName: "Wind Direction"
      units: "degree"

    - name: "ObsValue/windSpeed"
      source: variables/windSpeed
      longName: "Wind Speed"
      units: "m s-1"

    - name: "ObsValue/maximumWindGustDirection"
      source: variables/maximumWindGustDirection
      longName: "Maximum Wind Gust Direction"
      units: "degree"

    - name: "ObsValue/maximumWindGustSpeed"
      source: variables/maximumWindGustSpeed
      longName: "Max Wind Speed (GUSTS)"
      units: "m s-1"

    - name: "ObsValue/solarRadiationFlux"
      source: variables/solarRadiationFlux
      longName: "Solar Radiation Flux"
      units: "W m-2"

    - name: "ObsValue/rainfallWaterEquivalentOfSnowAveragedRate"
      source: variables/rainfallWaterEquivalentOfSnowAveragedRate
      longName: "RAINFALL/WATER Equivalent Of Snow (AVERAGED RATE)"
      units: "kg m-2 s-1"

    - name: "ObsValue/totalPrecipitation1"
      source: variables/totalPrecipitation1
      longName: "Total PRECIPITATION/TOTAL Water Equivalent (1)"
      units: "kg m-2"

    - name: "ObsValue/totalPrecipitation2"
      source: variables/totalPrecipitation2
      longName: "Total PRECIPITATION/TOTAL Water Equivalent (2)"
      units: "kg m-2"

    - name: "ObsValue/totalPrecipitation3"
      source: variables/totalPrecipitation3
      longName: "Total PRECIPITATION/TOTAL Water Equivalent (3)"
      units: "kg m-2"

    - name: "ObsValue/totalPrecipitation4"
      source: variables/totalPrecipitation4
      longName: "Total PRECIPITATION/TOTAL Water Equivalent (4)"
      units: "kg m-2"

    - name: "ObsValue/soilMoistureAvailability1"
      source: variables/soilMoistureAvailability1
      longName: "Soil Moisture Availability (1)"
      units: "%"

    - name: "ObsValue/soilMoistureAvailability2"
      source: variables/soilMoistureAvailability2
      longName: "Soil Moisture Availability (2)"
      units: "%"

    - name: "ObsValue/soilTemperature1"
      source: variables/soilTemperature1
      longName: "Soil Temperature (1)"
      units: "K"

    - name: "ObsValue/soilTemperature2"
      source: variables/soilTemperature2
      longName: "Soil Temperature (2)"
      units: "K"

    # QualityMarker
    - name: "QualityMarker/fslQcDataMntmdbsq"
      source: variables/fslQcDataMntmdbsq
      longName: "Fsl \"QC DATA\" Flag"

    - name: "QualityMarker/fslQcAppliedMntmdbsq"
      source: variables/fslQcAppliedMntmdbsq
      longName: "Fsl \"QC APPLIED\" Flag"

    - name: "QualityMarker/fslQcResultsMntmdbsq"
      source: variables/fslQcResultsMntmdbsq
      longName: "Fsl \"QC RESULTS\" Flag"

    - name: "QualityMarker/airTemperature"
      source: variables/airTemperature
      longName: "Sdmedit Quality Mark For Temperature"

    - name: "QualityMarker/fslQcDataMnrehusq"
      source: variables/fslQcDataMnrehusq
      longName: "Fsl \"QC DATA\" Flag"

    - name: "QualityMarker/fslQcAppliedMnrehusq"
      source: variables/fslQcAppliedMnrehusq
      longName: "Fsl \"QC APPLIED\" Flag"

    - name: "QualityMarker/fslQcResultsMnrehusq"
      source: variables/fslQcResultsMnrehusq
