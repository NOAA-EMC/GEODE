bufr:
  subsets:
    - NC012023

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    satelliteIdentifier:
      query: "*/SAID"

    instrumentIdentifier:
      query: "*/SIID"

    dataProviderOrigin:
      query: "*/OGCE"

    generatingSubCenter:
      query: "*/GSES"

    satelliteZenithAngle:
      query: "*/SAZA"

    sstBias:
      query: "*/SSTB"

    sensorChannelNumber:
      query: "*/SRDA/CHNM"

    pixelSType:
      query: "*/PIXT"

    # ObsValue
    acspoSstQualityFlags:
      query: "*/ACSQ"

    seaSurfaceTemperature:
      query: "*/SST0"

    standardDeviationSeaSurfaceTemperature:
      query: "*/SSTD"

    brightnessTemperature:
      query: "*/SRDA/TMBR"

  splits:
    satId:
      category:
        variable: satelliteIdentifier

encoder:
  dimensions:
    - name: Channel
      source: variables/sensorChannelNumber
      path: "*/SRDA"

  globals:
    - name: "description"
      type: string
      value: "M Type 012-023 NPP/VIIRS Sst (CLEAR Sky W/O LAND)"

    - name: "dataCategory"
      type: string
      value: "surface data from satellite"

    - name: "dataset"
      type: string
      value: "retrieval_sst_viirs"

    - name: "dataFormat"
      type: string
      value: "BUFR"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "012"

    - name: "bufrLocalSubcategory"
      type: string
      value: "023"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b012/xx023 NC012023"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteIdentifier
      longName: "Satellite Identifier"

    - name: "MetaData/instrumentIdentifier"
      source: variables/instrumentIdentifier
      longName: "Satellite Instruments"

    - name: "MetaData/dataProviderOrigin"
      source: variables/dataProviderOrigin
      longName: "Identification Of ORIGINATING/GENERATING Center"

    - name: "MetaData/generatingSubCenter"
      source: variables/generatingSubCenter
      longName: "Identification Of ORIGINATING/GENERATING SUB-CENTER"

    - name: "MetaData/satelliteZenithAngle"
      source: variables/satelliteZenithAngle
      longName: "Satellite Zenith Angle"
      units: "degree"

    - name: "MetaData/sstBias"
      source: variables/sstBias
      longName: "Sst Bias"
      units: "K"

    - name: "MetaData/sensorChannelNumber"
      source: variables/sensorChannelNumber
      longName: "Channel Number"

    - name: "MetaData/pixelSType"
      source: variables/pixelSType
      longName: "PIXEL(S) Type"

    # ObsValue
    - name: "ObsValue/acspoSstQualityFlags"
      source: variables/acspoSstQualityFlags
      longName: "Acspo Sst Quality Flags"

    - name: "ObsValue/seaSurfaceTemperature"
      source: variables/seaSurfaceTemperature
      longName: "Sea Surface Temperature"
      units: "K"

    - name: "ObsValue/standardDeviationSeaSurfaceTemperature"
      source: variables/standardDeviationSeaSurfaceTemperature
      longName: "Standard Deviation SEA-SURFACE Temperature"
      units: "K"

    - name: "ObsValue/brightnessTemperature"
      source: variables/brightnessTemperature
      longName: "Brightness Temperature (HIGH ACCURACY)"
      units: "K"
