bufr:
  subsets:
    - NC002016

  # One row per element of this sequence
  group_by_variable: height

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    receiptTime:
      datetime:
        year: "*/RCYR"
        month: "*/RCMO"
        day: "*/RCDY"
        hour: "*/RCHR"
        minute: "*/RCMI"

    latitude:
      query: "*/CLAT"

    longitude:
      query: "*/CLON"

    wigosIdentifierSeries:
      query: "*/WGOSIDS"

    wigosIssuerOfIdentifier:
      query: "*/WGOSISID"

    wigosIssueNumber:
      query: "*/WGOSISNM"

    wigosLocalIdentifierCharacter:
      query: "*/WGOSLID"

    stationIdentification:
      query: "*/RPID"

    receiptTimeSignificance:
      query: "*/RCTS"

    sequenceNumber:
      query: "*/SEQNUM"

    bulletinHeader:
      query: "*/BUHD"

    bulletinOriginator:
      query: "*/BORG"

    bulletinTime:
      query: "*/BULTIM"

    bulletinBBB:
      query: "*/BBB"

    wmoBlockNumber:
      query: "*/WMOB"

    wmoStationNumber:
      query: "*/WMOS"

    stationElevation:
      query: "*/SELV"

    v3DbBeamwidth:
      query: "*/BEAMW"

    rangeGateLength:
      query: "*/RAGL"

    frequency:
      query: "*/MEFR"

    stationType:
      query: "*/TOST"

    measuringEquipmentType:
      query: "*/A4ME"

    typeOfAntenna:
      query: "*/ANTYP"

    meanSpeedEstimation:
      query: "*/MSPE"

    windComputationEnhancement:
      query: "*/WICE"

    timeSignificance:
      query: "*/TSIG"

    timePeriodMinutes:
      query: "*/TPMI"

    height:
      query: "*/EPSEQ1/HEIT"

    # ObsValue
    windDirection:
      query: "*/EPSEQ1/WDIR"

    windSpeed:
      query: "*/EPSEQ1/WSPD"

    windUpward:
      query: "*/EPSEQ1/WCMP"

    signalToNoiseRatio:
      query: "*/EPSEQ1/STNR"

    # QualityMarker
    correctedReportIndicator:
      query: "*/CORN"

    qualityInformation1:
      query: "*/EPSEQ1/QMRK[1]"

    wind:
      query: "*/EPSEQ1/QMWN"

    qualityInformation2:
      query: "*/EPSEQ1/QMRK[2]"

encoder:
  globals:
    - name: "description"
      type: string
      value: "Msg Type 002-016 European Profiler Winds"

    - name: "dataCategory"
      type: string
      value: "vertical soundings other than satellite"

    - name: "dataset"
      type: string
      value: "profiler_europe"

    - name: "dataFormat"
      type: string
      value: "BUFR"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "002"

    - name: "bufrLocalSubcategory"
      type: string
      value: "016"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b002/xx016 NC002016"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/wigosIdentifierSeries"
      source: variables/wigosIdentifierSeries
      longName: "Wigos Identifier Series"

    - name: "MetaData/wigosIssuerOfIdentifier"
      source: variables/wigosIssuerOfIdentifier
      longName: "Wigos Issuer Of Identifier"

    - name: "MetaData/wigosIssueNumber"
      source: variables/wigosIssueNumber
      longName: "Wigos Issue Number"

    - name: "MetaData/wigosLocalIdentifierCharacter"
      source: variables/wigosLocalIdentifierCharacter
      longName: "Wigos Local Identifier (CHARACTER)"

    - name: "MetaData/stationIdentification"
      source: variables/stationIdentification
      longName: "Report Identifier"

    - name: "MetaData/receiptTimeSignificance"
      source: variables/receiptTimeSignificance
      longName: "Receipt Time Significance"

    - name: "MetaData/sequenceNumber"
      source: variables/sequenceNumber
      longName: "Channel Sequence Number"

    - name: "MetaData/bulletinHeader"
      source: variables/bulletinHeader
      longName: "BULLETIN BEING MONITORED (TTAAii)"

    - name: "MetaData/bulletinOriginator"
      source: variables/bulletinOriginator
      longName: "Bulletin Being Monitored (CCCC)"

    - name: "MetaData/bulletinTime"
      source: variables/bulletinTime
      longName: "BULLETIN BEING MONITORED (YYGGgg)"

    - name: "MetaData/bulletinBBB"
      source: variables/bulletinBBB
      longName: "Bulletin Being Monitored (BBB)"

    - name: "MetaData/wmoBlockNumber"
      source: variables/wmoBlockNumber
      longName: "Wmo Block Number"

    - name: "MetaData/wmoStationNumber"
      source: variables/wmoStationNumber
      longName: "Wmo Station Number"

    - name: "MetaData/stationElevation"
      source: variables/stationElevation
      longName: "Height Of Station"
      units: "m"

    - name: "MetaData/v3DbBeamwidth"
      source: variables/v3DbBeamwidth
      longName: "3-DB Beamwidth"
      units: "degree"

    - name: "MetaData/rangeGateLength"
      source: variables/rangeGateLength
      longName: "RANGE-GATE Length"
      units: "m"

    - name: "MetaData/frequency"
      source: variables/frequency
      longName: "Mean Frequency"
      units: "Hz"

    - name: "MetaData/stationType"
      source: variables/stationType
      longName: "Type Of Station"

    - name: "MetaData/measuringEquipmentType"
      source: variables/measuringEquipmentType
      longName: "Type Of Measuring Equipment Used"

    - name: "MetaData/typeOfAntenna"
      source: variables/typeOfAntenna
      longName: "Type Of Antenna"

    - name: "MetaData/meanSpeedEstimation"
      source: variables/meanSpeedEstimation
      longName: "Mean Speed Estimation"

    - name: "MetaData/windComputationEnhancement"
      source: variables/windComputationEnhancement
      longName: "Wind Computation Enhancement"

    - name: "MetaData/timeSignificance"
      source: variables/timeSignificance
      longName: "Time Significance"

    - name: "MetaData/timePeriodMinutes"
      source: variables/timePeriodMinutes
      longName: "Time Period Or Displacement"
      units: "min"

    - name: "MetaData/height"
      source: variables/height
      longName: "Height"
      units: "m"

    # ObsValue
    - name: "ObsValue/windDirection"
      source: variables/windDirection
      longName: "Wind Direction"
      units: "degree"

    - name: "ObsValue/windSpeed"
      source: variables/windSpeed
      longName: "Wind Speed"
      units: "m s-1"

    - name: "ObsValue/windUpward"
      source: variables/windUpward
      longName: "W Component"
      units: "m s-1"

    - name: "ObsValue/signalToNoiseRatio"
      source: variables/signalToNoiseRatio
      longName: "Signal To Noise Ratio"
      units: "dB"

    # QualityMarker
    - name: "QualityMarker/correctedReportIndicator"
      source: variables/correctedReportIndicator
      longName: "Corrected Report Indicator"

    - name: "QualityMarker/qualityInformation1"
      source: variables/qualityInformation1
      longName: "Quality Information"

    - name: "QualityMarker/wind"
      source: variables/wind
      longName: "Sdmedit Quality Mark For Wind"

    - name: "QualityMarker/qualityInformation2"
      source: variables/qualityInformation2
      longName: "Quality Information"
