encoder:
  globals:
    - name: "description"
      type: string
      value: "Msg Type 002-104 Dropwinsonde (BUFR)"

    - name: "dataCategory"
      type: string
      value: "vertical soundings other than satellite"

    - name: "dataset"
      type: string
      value: "upperair_dropsonde"

    - name: "dataFormat"
      type: string
      value: "BUFR"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "002"

    - name: "bufrLocalSubcategory"
      type: string
      value: "104"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b002/xx104 NC002104"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/wigosIdentifierSeries"
      source: variables/wigosIdentifierSeries
      longName: "Wigos Identifier Series"

    - name: "MetaData/wigosIssuerOfIdentifier"
      source: variables/wigosIssuerOfIdentifier
      longName: "Wigos Issuer Of Identifier"

    - name: "MetaData/wigosIssueNumber"
      source: variables/wigosIssueNumber
      longName: "Wigos Issue Number"

    - name: "MetaData/wigosLocalIdentifierCharacter"
      source: variables/wigosLocalIdentifierCharacter
      longName: "Wigos Local Identifier (CHARACTER)"

    - name: "MetaData/timeSignificance"
      source: variables/timeSignificance
      longName: "Time Significance"

    - name: "MetaData/stationIdentification"
      source: variables/stationIdentification
      longName: "Report Identifier"

    - name: "MetaData/aircraftFlightNumber1"
      source: variables/aircraftFlightNumber1
      longName: "Aircraft Flight Number (1)"

    - name: "MetaData/aircraftFlightNumber2"
      source: variables/aircraftFlightNumber2
      longName: "Aircraft Flight Number (2)"

    - name: "MetaData/radiosondeType1"
      source: variables/radiosondeType1
      longName: "Radiosonde Type (1)"

    - name: "MetaData/radiosondeType2"
      source: variables/radiosondeType2
      longName: "Radiosonde Type (2)"

    - name: "MetaData/solarAndInfraredRadiationCorrection1"
      source: variables/solarAndInfraredRadiationCorrection1
      longName: "Solar And Infrared Radiation Correction (1)"

    - name: "MetaData/solarAndInfraredRadiationCorrection2"
      source: variables/solarAndInfraredRadiationCorrection2
      longName: "Solar And Infrared Radiation Correction (2)"

    - name: "MetaData/trackingTechniqueStatusOfSystemUsed1"
      source: variables/trackingTechniqueStatusOfSystemUsed1
      longName: "Tracking TECHNIQUE/STATUS Of System Used (1)"

    - name: "MetaData/trackingTechniqueStatusOfSystemUsed2"
      source: variables/trackingTechniqueStatusOfSystemUsed2
      longName: "Tracking TECHNIQUE/STATUS Of System Used (2)"

    - name: "MetaData/measuringEquipmentType1"
