bufr:
  subsets:
    - NC002104

  # One row per element of this sequence
  group_by_variable: extendedVerticalSoundingSignificance

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    receiptTime:
      datetime:
        year: "*/RCPTIM{1}/RCYR"
        month: "*/RCPTIM{1}/RCMO"
        day: "*/RCPTIM{1}/RCDY"
        hour: "*/RCPTIM{1}/RCHR"
        minute: "*/RCPTIM{1}/RCMI"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    wigosIdentifierSeries:
      query: "*/WGOSIDS"

    wigosIssuerOfIdentifier:
      query: "*/WGOSISID"

    wigosIssueNumber:
      query: "*/WGOSISNM"

    wigosLocalIdentifierCharacter:
      query: "*/WGOSLID"

    timeSignificance:
      query: "*/TSIG"

    stationIdentification:
      query: "*/RPID"

    aircraftFlightNumber1:
      query: "*/IDLPIDRP{1}/ACID"

    aircraftFlightNumber2:
      query: "*/IDLPIDRP{2}/ACID"

    radiosondeType1:
      query: "*/IDLPIDRP{1}/RATP"

    radiosondeType2:
      query: "*/IDLPIDRP{2}/RATP"

    solarAndInfraredRadiationCorrection1:
      query: "*/IDLPIDRP{1}/SIRC"

    solarAndInfraredRadiationCorrection2:
      query: "*/IDLPIDRP{2}/SIRC"

    trackingTechniqueStatusOfSystemUsed1:
      query: "*/IDLPIDRP{1}/TTSS"

    trackingTechniqueStatusOfSystemUsed2:
      query: "*/IDLPIDRP{2}/TTSS"

    measuringEquipmentType1:
      query: "*/IDLPIDRP{1}/A4ME"

    measuringEquipmentType2:
      query: "*/IDLPIDRP{2}/A4ME"

    wmoBlockNumber:
      query: "*/WMOB"

    wmoStationNumber:
      query: "*/WMOS"

    shipOrMobileStationIdentifier:
      query: "*/SMID"

    stationElevation:
      query: "*/HSMSL"

    heightOfBarometerAboveMeanSeaLevel:
      query: "*/HBMSL"

    height:
      query: "*/HEIT"

    radiosondeSerialNumber:
      query: "*/RSERL"

    radiosondeAscensionNumber:
      query: "*/RASCN"

    radiosondeReleaseNumber:
      query: "*/RRLSE"

    observerIdentification:
      query: "*/OBSVR"

    radiosondeCompleteness:
      query: "*/RACP"

    radiosondeConfiguration:
      query: "*/RCONF"

    correctionAlgorithmsForHumidityMeasurements:
      query: "*/CAHM"

    radiosondeGroundReceivingSystem:
      query: "*/RGRSY"

    radiosondeOperatingFrequency:
      query: "*/RFREQ"

    balloonManufacturer:
      query: "*/BMFGR"

    typeOfBalloon:
      query: "*/BTYPE"

    weightOfBalloon:
      query: "*/BWGHT"

    typeOfBalloonShelter:
      query: "*/BSHEL"

    typeOfGasUsedInBalloon:
      query: "*/BGTYP"

    amountOfGasUsedInBalloon:
      query: "*/BGAMT"

    balloonFlightTrainLength:
      query: "*/BFTLN"

    typeOfPressureSensor:
      query: "*/PSENS"

    typeOfTemperatureSensor:
      query: "*/TSENS"

    typeOfHumiditySensor:
      query: "*/RHSENS"

    radome:
      query: "*/RADO"

    geopotentialHeightCalculation:
      query: "*/GHTC"

    softwareVersion:
      query: "*/SOFTV"

    reasonForTermination:
      query: "*/RTERM"

    volumeOfGasUsedInBalloon:
      query: "*/BGVOL"

    extendedVerticalSoundingSignificance:
      query: "*/UARLVB/VSIGX"

    longTimePeriodSeconds:
      query: "*/UARLVB/LTDS"

    latitudeDisplacementHighAccuracy:
      query: "*/UARLVB/LATDH"

    longitudeDisplacementHighAccuracy:
      query: "*/UARLVB/LONDH"

    pressure:
      query: "*/UARLVB/PRLC"

    sequenceNumber:
      query: "*/BID{1}/SEQNUM"

    bulletinHeader:
      query: "*/BID{1}/BUHD"

    bulletinOriginator:
      query: "*/BID{1}/BORG"

    bulletinTime:
      query: "*/BID{1}/BULTIM"

    bulletinBBB:
      query: "*/BID{1}/BBB"

    receiptTimeSignificance:
      query: "*/RCPTIM{1}/RCTS"

    # ObsValue
    geopotential07:
      query: "*/UARLVB/UAGP07/GP07"

    geopotential10:
      query: "*/UARLVB/UAGP10/GP10"

    airTemperatureTMDB:
      query: "*/UARLVB/UATMP/TMDB"

    dewPointTemperature:
      query: "*/UARLVB/UATMP/TMDP"

    windDirection:
      query: "*/UARLVB/UAWND/WDIR"

    windSpeed:
      query: "*/UARLVB/UAWND/WSPD"

    absoluteWindShearIn1KmLayerBelow:
      query: "*/UARLVB/UAWSH/AWSB"

    absoluteWindShearIn1KmLayerAbove:
      query: "*/UARLVB/UAWSH/AWSA"

    modifiedShowalterStabilityIndex:
      query: "*/MEANFL/STBS"

    meanWindDirectionForSurface1500mLayer:
      query: "*/MEANFL/MWDL"

    meanWindSpeedForSurface1500mLayer:
      query: "*/MEANFL/MWSL"

    meanWindDirectionFor15003000M:
      query: "*/MEANFL/MWDIRL"

    meanWindSpeedFor15003000M:
      query: "*/MEANFL/MWSPDL"

    # QualityMarker
    stationElevationQualityMarkForMobilStations:
      query: "*/QCEVR"

    pressureQMPR:
      query: "*/UARLVB/QMPR"

    geopotential:
      query: "*/UARLVB/QMGP"

    airTemperature:
      query: "*/UARLVB/UATMP/QMAT"

    moisture:
      query: "*/UARLVB/UATMP/QMDD"

    wind:
      query: "*/UARLVB/UAWND/QMWN"

    correctedReportIndicator1:
      query: "*/CORNSQ{1}/CORN"

    correctedReportIndicator2:
      query: "*/CORNSQ{2}/CORN"

    # Not in this tank: other tanks in this dataset have these
    radiosondePartName1:
      query: "*/UARLVB/ABSENT"
      type: string

    radiosondePartName2:
      query: "*/UARLVB/ABSENT"
      type: string

    windInstrumentationType1:
      query: "*/UARLVB/ABSENT"
      type: int

    windInstrumentationType2:
      query: "*/UARLVB/ABSENT"
      type: int

    verticalSoundingSignificance:
      query: "*/UARLVB/ABSENT"
      type: int

    solarAndInfraredRadiationCorrection:
      query: "*/UARLVB/ABSENT"
      type: int

    trackingTechniqueStatusOfSystemUsed:
      query: "*/UARLVB/ABSENT"
      type: int

    radiosondeLaunchHour:
      query: "*/UARLVB/ABSENT"
      type: int

    radiosondeLaunchMinute:
      query: "*/UARLVB/ABSENT"
      type: int

    extrapolatedMandatoryLevelPressure:
      query: "*/UARLVB/ABSENT"
      type: int

    radiosondeShipDropOrMobilStationId:
      query: "*/UARLVB/ABSENT"
      type: string

    wmoRegionNumber:
      query: "*/UARLVB/ABSENT"
      type: int

    seaSurfaceTemperatureSST1:
      query: "*/UARLVB/ABSENT"
      type: float

    meanWindDirectionFor1500m3000mLayer:
      query: "*/UARLVB/ABSENT"
      type: int

    meanWindSpeedFor1500m3000mLayer:
      query: "*/UARLVB/ABSENT"
      type: float

    modifiedShowalterStabilityIndexSTBS5:
      query: "*/UARLVB/ABSENT"
      type: int

    extrapolatedMandatoryLevelGeopotential:
      query: "*/UARLVB/ABSENT"
      type: int

    seaSurfaceTemperature:
      query: "*/UARLVB/ABSENT"
      type: int

    radiosondeReportDiagnosticCode1:
      query: "*/UARLVB/ABSENT"
      type: int

    radiosondeReportDiagnosticCode2:
      query: "*/UARLVB/ABSENT"
      type: int

    radiosondeReportDiagnosticCode3:
      query: "*/UARLVB/ABSENT"
      type: int

    radiosondeReportDiagnosticCode4:
      query: "*/UARLVB/ABSENT"
