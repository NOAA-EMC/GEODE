bufr:
  subsets:
    - NC004002

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"

    receiptTime:
      datetime:
        year: "*/RCYR"
        month: "*/RCMO"
        day: "*/RCDY"
        hour: "*/RCHR"
        minute: "*/RCMI"

    latitude:
      query: "*/CLAT"

    longitude:
      query: "*/CLON"

    receiptTimeSignificance:
      query: "*/RCTS"

    sequenceNumber:
      query: "*/SEQNUM"

    bulletinHeader:
      query: "*/BUHD"

    bulletinOriginator:
      query: "*/BORG"

    bulletinTime:
      query: "*/BULTIM"

    bulletinBBB:
      query: "*/BBB"

    stationIdentification:
      query: "*/RPID"

    flightLevel:
      query: "*/FLVL"

    pressureAltitude:
      query: "*/PSAL"

    rawReportString:
      query: "*/RAWRPT/RRSTG"

    typeOfCommercialAircraft:
      query: "*/ACTP"

    # ObsValue
    airTemperatureTMDB:
      query: "*/TMDB"

    windDirection:
      query: "*/WDIR"

    windSpeed:
      query: "*/WSPD"

    cloudAmount1:
      query: "*/AFCLD{1}/CLAM"

    cloudAmount2:
      query: "*/AFCLD{2}/CLAM"

    cloudAmount3:
      query: "*/AFCLD{3}/CLAM"

    cloudAmount4:
      query: "*/AFCLD{4}/CLAM"

    cloudAmount5:
      query: "*/AFCLD{5}/CLAM"

    cloudAmount6:
      query: "*/AFCLD{6}/CLAM"

    cloudType1:
      query: "*/AFCLD{1}/CLTP"

    cloudType2:
      query: "*/AFCLD{2}/CLTP"

    cloudType3:
      query: "*/AFCLD{3}/CLTP"

    cloudType4:
      query: "*/AFCLD{4}/CLTP"

    cloudType5:
      query: "*/AFCLD{5}/CLTP"

    cloudType6:
      query: "*/AFCLD{6}/CLTP"

    heightbasecloud1:
      query: "*/AFCLD{1}/HOCB"

    heightbasecloud2:
      query: "*/AFCLD{2}/HOCB"

    heightbasecloud3:
      query: "*/AFCLD{3}/HOCB"

    heightbasecloud4:
      query: "*/AFCLD{4}/HOCB"

    heightbasecloud5:
      query: "*/AFCLD{5}/HOCB"

    heightbasecloud6:
      query: "*/AFCLD{6}/HOCB"

    heightOfTopOfCloud1:
      query: "*/AFCLD{1}/HOCT"

    heightOfTopOfCloud2:
      query: "*/AFCLD{2}/HOCT"

    heightOfTopOfCloud3:
      query: "*/AFCLD{3}/HOCT"

    heightOfTopOfCloud4:
      query: "*/AFCLD{4}/HOCT"

    heightOfTopOfCloud5:
      query: "*/AFCLD{5}/HOCT"

    heightOfTopOfCloud6:
      query: "*/AFCLD{6}/HOCT"

    airframeIcing:
      query: "*/AFICG{1}/AFIC"

    heightOfBaseOfIcing:
      query: "*/AFICG{1}/HBOI"

    heightOfTopOfIcing:
      query: "*/AFICG{1}/HTOI"

    degreeOfTurbulence1:
      query: "*/APTRB{1}/DGOT"

    degreeOfTurbulence2:
      query: "*/APTRB{2}/DGOT"

    degreeOfTurbulence3:
      query: "*/APTRB{3}/DGOT"

    degreeOfTurbulence4:
      query: "*/APTRB{4}/DGOT"

    heightOfBaseOfTurbulence1:
      query: "*/APTRB{1}/HBOT"

    heightOfBaseOfTurbulence2:
      query: "*/APTRB{2}/HBOT"

    heightOfBaseOfTurbulence3:
      query: "*/APTRB{3}/HBOT"

    heightOfBaseOfTurbulence4:
      query: "*/APTRB{4}/HBOT"

    heightOfTopOfTurbulence1:
      query: "*/APTRB{1}/HTOT"

    heightOfTopOfTurbulence2:
      query: "*/APTRB{2}/HTOT"

    heightOfTopOfTurbulence3:
      query: "*/APTRB{3}/HTOT"

    heightOfTopOfTurbulence4:
      query: "*/APTRB{4}/HTOT"

    presentWeather1:
      query: "*/APPWX{1}/PRWE"

    presentWeather2:
      query: "*/APPWX{2}/PRWE"

    presentWeather3:
      query: "*/APPWX{3}/PRWE"

    presentWeather4:
      query: "*/APPWX{4}/PRWE"

    heightOfBaseOfPresentWeather1:
      query: "*/APPWX{1}/HBWX"

    heightOfBaseOfPresentWeather2:
      query: "*/APPWX{2}/HBWX"

    heightOfBaseOfPresentWeather3:
      query: "*/APPWX{3}/HBWX"

    heightOfBaseOfPresentWeather4:
      query: "*/APPWX{4}/HBWX"

    heightOfTopOfPresentWeather1:
      query: "*/APPWX{1}/HTWX"

    heightOfTopOfPresentWeather2:
      query: "*/APPWX{2}/HTWX"

    heightOfTopOfPresentWeather3:
      query: "*/APPWX{3}/HTWX"

    heightOfTopOfPresentWeather4:
      query: "*/APPWX{4}/HTWX"

    horizontalVisibility:
      query: "*/HOVI"

    # QualityMarker
    correctedReportIndicator:
      query: "*/CORN"

    airTemperature:
      query: "*/QMAT"

    wind:
      query: "*/QMWN"

encoder:
  dimensions:
    - name: RawReportChunk
      path: "*/RAWRPT"

  globals:
    - name: "description"
      type: string
      value: "MTYP 004-002 Manual PIREP (PIREP)"

    - name: "dataCategory"
      type: string
      value: "single level upper-air data other than satellite"

    - name: "dataset"
      type: string
      value: "aircraft_pirep"

    - name: "dataFormat"
      type: string
      value: "PIREP"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "004"

    - name: "bufrLocalSubcategory"
      type: string
      value: "002"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b004/xx002 NC004002"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/receiptTimeSignificance"
      source: variables/receiptTimeSignificance
      longName: "Receipt Time Significance"

    - name: "MetaData/sequenceNumber"
      source: variables/sequenceNumber
      longName: "Channel Sequence Number"

    - name: "MetaData/bulletinHeader"
      source: variables/bulletinHeader
      longName: "BULLETIN BEING MONITORED (TTAAii)"

    - name: "MetaData/bulletinOriginator"
      source: variables/bulletinOriginator
      longName: "Bulletin Being Monitored (CCCC)"

    - name: "MetaData/bulletinTime"
      source: variables/bulletinTime
      longName: "BULLETIN BEING MONITORED (YYGGgg)"

    - name: "MetaData/bulletinBBB"
      source: variables/bulletinBBB
      longName: "Bulletin Being Monitored (BBB)"

    - name: "MetaData/stationIdentification"
      source: variables/stationIdentification
      longName: "Report Identifier"

    - name: "MetaData/flightLevel"
      source: variables/flightLevel
      longName: "Flight Level"
      units: "m"

    - name: "MetaData/pressureAltitude"
      source: variables/pressureAltitude
      longName: "Pressure Altitude Relative To Mean Sea Level"
      units: "m"

    - name: "MetaData/rawReportString"
      source: variables/rawReportString
      longName: "Raw Report String"

    - name: "MetaData/typeOfCommercialAircraft"
      source: variables/typeOfCommercialAircraft
      longName: "Type Of Commercial Aircraft"

    # ObsValue
    - name: "ObsValue/airTemperatureTMDB"
      source: variables/airTemperatureTMDB
      longName: "TEMPERATURE/DRY Bulb Temperature"
      units: "K"

    - name: "ObsValue/windDirection"
      source: variables/windDirection
      longName: "Wind Direction"
      units: "degree"

    - name: "ObsValue/windSpeed"
      source: variables/windSpeed
      longName: "Wind Speed"
      units: "m s-1"

    - name: "ObsValue/cloudAmount1"
      source: variables/cloudAmount1
      longName: "Cloud Amount (1)"

    - name: "ObsValue/cloudAmount2"
      source: variables/cloudAmount2
      longName: "Cloud Amount (2)"

    - name: "ObsValue/cloudAmount3"
      source: variables/cloudAmount3
      longName: "Cloud Amount (3)"

    - name: "ObsValue/cloudAmount4"
      source: variables/cloudAmount4
      longName: "Cloud Amount (4)"

    - name: "ObsValue/cloudAmount5"
      source: variables/cloudAmount5
      longName: "Cloud Amount (5)"

    - name: "ObsValue/cloudAmount6"
      source: variables/cloudAmount6
      longName: "Cloud Amount (6)"

    - name: "ObsValue/cloudType1"
      source: variables/cloudType1
      longName: "Cloud Type (1)"

    - name: "ObsValue/cloudType2"
      source: variables/cloudType2
      longName: "Cloud Type (2)"

    - name: "ObsValue/cloudType3"
      source: variables/cloudType3
