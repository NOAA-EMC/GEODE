encoder:
  globals:
    - name: "description"
      type: string
      value: "Message Type 001-113 Surface Marine Ship (BUFR)"

    - name: "dataCategory"
      type: string
      value: "surface marine"

    - name: "dataset"
      type: string
      value: "surface_ship"

    - name: "dataFormat"
      type: string
      value: "BUFR"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "001"

    - name: "bufrLocalSubcategory"
      type: string
      value: "113"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b001/xx113 NC001113"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/stationIdentification"
      source: variables/stationIdentification
      longName: "Report Identifier"

    - name: "MetaData/shipOrMobileStationIdentifier"
      source: variables/shipOrMobileStationIdentifier
      longName: "Ship or mobile land station identifier"

    - name: "MetaData/dirOfMotionOfMovingObservingPlatform"
      source: variables/dirOfMotionOfMovingObservingPlatform
      longName: "DIR. Of Motion Of Moving Observing Platform"
      units: "degree"

    - name: "MetaData/speedOfMotionOfMovingObservingPlatform"
      source: variables/speedOfMotionOfMovingObservingPlatform
      longName: "Speed of motion of moving observing platform"
      units: "m s-1"

    - name: "MetaData/stationType"
      source: variables/stationType
      longName: "Type Of Station"

    - name: "MetaData/stationElevation"
      source: variables/stationElevation
      longName: "Height Of Station Ground Above Msl"
      units: "m"

    - name: "MetaData/heightOfBarometerAboveMeanSeaLevel"
      source: variables/heightOfBarometerAboveMeanSeaLevel
      longName: "Height of barometer above mean sea level"
      units: "m"

    - name: "MetaData/wigosIdentifierSeries"
      source: variables/wigosIdentifierSeries
      longName: "Wigos Identifier Series"

    - name: "MetaData/wigosIssuerOfIdentifier"
      source: variables/wigosIssuerOfIdentifier
      longName: "Wigos Issuer Of Identifier"

    - name: "MetaData/wigosIssueNumber"
      source: variables/wigosIssueNumber
      longName: "Wigos Issue Number"

    - name: "MetaData/wigosLocalIdentifierCharacter"
      source: variables/wigosLocalIdentifierCharacter
      longName: "Wigos Local Identifier (CHARACTER)"

    - name: "MetaData/heightOfSensorAboveGround"
      source: variables/heightOfSensorAboveGround
      longName: "Height of sensor above local ground (or deck of marine"
      units: "m"

    - name: "MetaData/heightOfSensorAboveWater"
      source: variables/heightOfSensorAboveWater
      longName: "Height of sensor above water surface"
      units: "m"

    - name: "MetaData/methodOfWetBulbTemperatureMeasurement"
