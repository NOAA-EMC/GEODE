encoder:
  globals:
    - name: "description"
      type: string
      value: "MTYP 255-003 Mesonet from MADIS: MesoWest (many subpr)"

    - name: "dataCategory"
      type: string
      value: "other"

    - name: "dataset"
      type: string
      value: "mesonet_madis_mesowest"

    - name: "dataFormat"
      type: string
      value: "netCDF"

    - name: "restricted"
      type: string
      value: "true"

    - name: "bufrCategory"
      type: string
      value: "255"

    - name: "bufrLocalSubcategory"
      type: string
      value: "003"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b255/xx003 NC255003"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/receiptTimeSignificance"
      source: variables/receiptTimeSignificance
      longName: "Receipt Time Significance"

    - name: "MetaData/restrictionFlag"
      source: variables/restrictionFlag
      longName: "Restrictions On Redistribution"

    - name: "MetaData/restrictionExpiration"
      source: variables/restrictionExpiration
      longName: "Expiration Of Restrictions On Redistribution"
      units: "h"

    - name: "MetaData/stationIdentification"
      source: variables/stationIdentification
      longName: "Report Identifier"

    - name: "MetaData/providerIdentifier1"
      source: variables/providerIdentifier1
      longName: "Mesonet Provider Id String (1)"

    - name: "MetaData/providerIdentifier2"
      source: variables/providerIdentifier2
      longName: "Mesonet Provider Id String (2)"

    - name: "MetaData/subProviderIdentifier1"
      source: variables/subProviderIdentifier1
      longName: "Mesonet Subprovider Id String (1)"

    - name: "MetaData/subProviderIdentifier2"
      source: variables/subProviderIdentifier2
      longName: "Mesonet Subprovider Id String (2)"

    - name: "MetaData/stationElevation"
      source: variables/stationElevation
      longName: "Height Of Station"
      units: "m"

    - name: "MetaData/timePeriodHours1"
      source: variables/timePeriodHours1
      longName: "Time Period Or Displacement (1)"
      units: "h"

    - name: "MetaData/timePeriodHours2"
      source: variables/timePeriodHours2
      longName: "Time Period Or Displacement (2)"
      units: "h"

    - name: "MetaData/timePeriodHours3"
      source: variables/timePeriodHours3
      longName: "Time Period Or Displacement (3)"
      units: "h"

    - name: "MetaData/timePeriodHours4"
      source: variables/timePeriodHours4
      longName: "Time Period Or Displacement (4)"
      units: "h"

    - name: "MetaData/timePeriodMinutes1"
      source: variables/timePeriodMinutes1
      longName: "Time Period Or Displacement (1)"
      units: "min"

    - name: "MetaData/timePeriodMinutes2"
      source: variables/timePeriodMinutes2
      longName: "Time Period Or Displacement (2)"
      units: "min"

    # ObsValue
    - name: "ObsValue/airPressure"
      source: variables/airPressure
      longName: "Pressure"
      units: "Pa"

    - name: "ObsValue/altimeterSetting"
      source: variables/altimeterSetting
      longName: "Altimeter Setting"
      units: "Pa"

    - name: "ObsValue/airTemperatureTMDB"
      source: variables/airTemperatureTMDB
      longName: "TEMPERATURE/DRY Bulb Temperature"
      units: "K"

    - name: "ObsValue/dewPointTemperature"
      source: variables/dewPointTemperature
      longName: "Dew Point Temperature"
      units: "K"

    - name: "ObsValue/windDirection"
      source: variables/windDirection
      longName: "Wind Direction"
      units: "degree"

    - name: "ObsValue/windSpeed"
      source: variables/windSpeed
      longName: "Wind Speed"
      units: "m s-1"

    - name: "ObsValue/maximumWindGustDirection"
      source: variables/maximumWindGustDirection
      longName: "Maximum Wind Gust Direction"
      units: "degree"

    - name: "ObsValue/maximumWindGustSpeed"
      source: variables/maximumWindGustSpeed
      longName: "Max Wind Speed (GUSTS)"
      units: "m s-1"

    - name: "ObsValue/soilMoistureTension"
