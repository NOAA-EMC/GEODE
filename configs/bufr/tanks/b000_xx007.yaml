encoder:
  dimensions:
    - name: RawReportChunk
      path: "*/RAWRPT"

  globals:
    - name: "description"
      type: string
      value: "Mtyp 000-007 Aviation - Metar / Speci"

    - name: "dataCategory"
      type: string
      value: "surface land"

    - name: "dataset"
      type: string
      value: "surface_metar"

    - name: "dataFormat"
      type: string
      value: "WMO FM-15 METAR / WMO FM-16 SPECI"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "000"

    - name: "bufrLocalSubcategory"
      type: string
      value: "007"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b000/xx007 NC000007"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/sequenceNumber"
      source: variables/sequenceNumber
      longName: "Channel Sequence Number"

    - name: "MetaData/bulletinHeader"
      source: variables/bulletinHeader
      longName: "BULLETIN BEING MONITORED (TTAAii)"

    - name: "MetaData/bulletinOriginator"
      source: variables/bulletinOriginator
      longName: "Bulletin Being Monitored (CCCC)"

    - name: "MetaData/bulletinTime"
      source: variables/bulletinTime
      longName: "BULLETIN BEING MONITORED (YYGGgg)"

    - name: "MetaData/bulletinBBB"
      source: variables/bulletinBBB
      longName: "Bulletin Being Monitored (BBB)"

    - name: "MetaData/stationIdentification"
      source: variables/stationIdentification
      longName: "Report Identifier"

    - name: "MetaData/shortIcaoLocationIndicator"
      source: variables/shortIcaoLocationIndicator
      longName: "Short Icao Location Indicator"

    - name: "MetaData/stationElevation"
      source: variables/stationElevation
      longName: "Height Of Station"
      units: "m"

    - name: "MetaData/typeOfHourlyReport"
      source: variables/typeOfHourlyReport
      longName: "Type Of Hourly Report"

    - name: "MetaData/automatedStationType"
      source: variables/automatedStationType
      longName: "Automated Station Type"

    - name: "MetaData/receiptTimeSignificance"
      source: variables/receiptTimeSignificance
      longName: "Receipt Time Significance"

    - name: "MetaData/timeOfOccurenceOfWindShiftHours"
      source: variables/timeOfOccurenceOfWindShiftHours
      longName: "Time Of Occurence Of Wind Shift (HOURS)"
      units: "h"

    - name: "MetaData/timeOfOccurenceOfWindShiftMinutes"
