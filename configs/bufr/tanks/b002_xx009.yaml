encoder:
  globals:
    - name: "description"
      type: string
      value: "Msg Type 002-009 Profiler Winds In PILOT(PIBAL) Format"

    - name: "dataCategory"
      type: string
      value: "vertical soundings other than satellite"

    - name: "dataset"
      type: string
      value: "profiler_winds"

    - name: "dataFormat"
      type: string
      value: "WMO FM-32 PILOT"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "002"

    - name: "bufrLocalSubcategory"
      type: string
      value: "009"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b002/xx009 NC002009"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/receiptTimeSignificance"
      source: variables/receiptTimeSignificance
      longName: "Receipt Time Significance"

    - name: "MetaData/sequenceNumber"
      source: variables/sequenceNumber
      longName: "Channel Sequence Number"

    - name: "MetaData/bulletinHeader"
      source: variables/bulletinHeader
      longName: "BULLETIN BEING MONITORED (TTAAii)"

    - name: "MetaData/bulletinOriginator"
      source: variables/bulletinOriginator
      longName: "Bulletin Being Monitored (CCCC)"

    - name: "MetaData/bulletinTime"
      source: variables/bulletinTime
      longName: "BULLETIN BEING MONITORED (YYGGgg)"

    - name: "MetaData/bulletinBBB"
      source: variables/bulletinBBB
      longName: "Bulletin Being Monitored (BBB)"

    - name: "MetaData/stationIdentification"
      source: variables/stationIdentification
      longName: "Report Identifier"

    - name: "MetaData/stationElevation"
      source: variables/stationElevation
      longName: "Height Of Station"
      units: "m"

    - name: "MetaData/radiosondeType1"
      source: variables/radiosondeType1
      longName: "Radiosonde Type (1)"

    - name: "MetaData/radiosondeType2"
      source: variables/radiosondeType2
      longName: "Radiosonde Type (2)"

    - name: "MetaData/measuringEquipmentType1"
      source: variables/measuringEquipmentType1
      longName: "Type Of Measuring Equipment Used (1)"

    - name: "MetaData/measuringEquipmentType2"
      source: variables/measuringEquipmentType2
      longName: "Type Of Measuring Equipment Used (2)"

    - name: "MetaData/radiosondePartName1"
      source: variables/radiosondePartName1
      longName: "Radiosonde Part Name (1)"

    - name: "MetaData/radiosondePartName2"
      source: variables/radiosondePartName2
      longName: "Radiosonde Part Name (2)"

    - name: "MetaData/windInstrumentationType1"
      source: variables/windInstrumentationType1
      longName: "Type Of Instrumentation For Wind Measurement (1)"

    - name: "MetaData/windInstrumentationType2"
      source: variables/windInstrumentationType2
      longName: "Type Of Instrumentation For Wind Measurement (2)"

    - name: "MetaData/verticalSoundingSignificance"
      source: variables/verticalSoundingSignificance
      longName: "Vertical Sounding Significance"

    - name: "MetaData/pressure"
      source: variables/pressure
      longName: "Pressure"
      units: "Pa"

    - name: "MetaData/solarAndInfraredRadiationCorrection"
      source: variables/solarAndInfraredRadiationCorrection
      longName: "Solar And Infrared Radiation Correction"

    - name: "MetaData/trackingTechniqueStatusOfSystemUsed"
      source: variables/trackingTechniqueStatusOfSystemUsed
      longName: "Tracking TECHNIQUE/STATUS Of System Used"

    - name: "MetaData/radiosondeLaunchHour"
      source: variables/radiosondeLaunchHour
      longName: "Radiosonde Launch Hour"
      units: "h"

    - name: "MetaData/radiosondeLaunchMinute"
      source: variables/radiosondeLaunchMinute
      longName: "Radiosonde Launch Minute"
      units: "min"

    - name: "MetaData/extrapolatedMandatoryLevelPressure"
      source: variables/extrapolatedMandatoryLevelPressure
