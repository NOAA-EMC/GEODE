      query: "*/UARDCS{3}/UARDC"

    radiosondeReportDiagnosticCode4:
      query: "*/UARDCS{4}/UARDC"

    radiosondeReportDiagnosticCode5:
      query: "*/UARDCS{5}/UARDC"

    radiosondeReportDiagnosticCode6:
      query: "*/UARDCS{6}/UARDC"

    radiosondeReportDiagnosticCode7:
      query: "*/UARDCS{7}/UARDC"

    radiosondeReportDiagnosticCode8:
      query: "*/UARDCS{8}/UARDC"

    radiosondeReportDiagnosticCode9:
