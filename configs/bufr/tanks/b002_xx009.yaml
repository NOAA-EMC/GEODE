bufr:
  subsets:
    - NC002009

  # One row per element of this sequence
  group_by_variable: verticalSoundingSignificance

  variables:
    # Not mapped: see the sequence notes in dev/ush/generate_bufr_tank_yamls.py
    #   */RAWRPT/RRSTG

    # MetaData
    timestamp:
      datetime:
        # MINU is not in this subset; minute is treated as 0
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"

    receiptTime:
      datetime:
        year: "*/RCPTIM{1}/RCYR"
        month: "*/RCPTIM{1}/RCMO"
        day: "*/RCPTIM{1}/RCDY"
        hour: "*/RCPTIM{1}/RCHR"
        minute: "*/RCPTIM{1}/RCMI"

    latitude:
      query: "*/CLAT"

    longitude:
      query: "*/CLON"

    receiptTimeSignificance:
      query: "*/RCPTIM{1}/RCTS"

    sequenceNumber:
      query: "*/BID{1}/SEQNUM"

    bulletinHeader:
      query: "*/BID{1}/BUHD"

    bulletinOriginator:
      query: "*/BID{1}/BORG"

    bulletinTime:
      query: "*/BID{1}/BULTIM"

    bulletinBBB:
      query: "*/BID{1}/BBB"

    stationIdentification:
      query: "*/RPID"

    stationElevation:
      query: "*/SELV"

    radiosondeType1:
      query: "*/UARID{1}/RATP"

    radiosondeType2:
      query: "*/UARID{2}/RATP"

    measuringEquipmentType1:
      query: "*/UARID{1}/A4ME"

    measuringEquipmentType2:
      query: "*/UARID{2}/A4ME"

    radiosondePartName1:
      query: "*/UARID{1}/UAPART"

    radiosondePartName2:
      query: "*/UARID{2}/UAPART"

    windInstrumentationType1:
      query: "*/UARID{1}/TIWM"

    windInstrumentationType2:
      query: "*/UARID{2}/TIWM"

    verticalSoundingSignificance:
      query: "*/UARLV/VSIG"

    pressure:
      query: "*/UARLV/PRLC"

    solarAndInfraredRadiationCorrection:
      query: "*/UASDG/SIRC"

    trackingTechniqueStatusOfSystemUsed:
      query: "*/UASDG/TTSS"

    radiosondeLaunchHour:
      query: "*/UASDG/UALNHR"

    radiosondeLaunchMinute:
      query: "*/UASDG/UALNMN"

    extrapolatedMandatoryLevelPressure:
      query: "*/UAADF/XMPRLC"

    radiosondeShipDropOrMobilStationId:
      query: "*/RSML"

    wmoBlockNumber:
      query: "*/WMOB"

    wmoStationNumber:
      query: "*/WMOS"

    wmoRegionNumber:
      query: "*/WMOR"

    # ObsValue
    geopotential07:
      query: "*/UARLV/UAGP07/GP07"

    geopotential10:
      query: "*/UARLV/UAGP10/GP10"

    airTemperatureTMDB:
      query: "*/UARLV/UATMP/TMDB"

    dewPointTemperature:
      query: "*/UARLV/UATMP/TMDP"

    windDirection:
      query: "*/UARLV/UAWND/WDIR"

    windSpeed:
      query: "*/UARLV/UAWND/WSPD"

    absoluteWindShearIn1KmLayerBelow:
      query: "*/UARLV/UAWSH/AWSB"

    absoluteWindShearIn1KmLayerAbove:
      query: "*/UARLV/UAWSH/AWSA"

    seaSurfaceTemperatureSST1:
      query: "*/UASDG/SST1"

    cloudType1:
      query: "*/UACLD{1}/CLTP"

    cloudType2:
      query: "*/UACLD{2}/CLTP"

    cloudType3:
      query: "*/UACLD{3}/CLTP"

    cloudType4:
      query: "*/UACLD{4}/CLTP"

    cloudType5:
      query: "*/UACLD{5}/CLTP"

    cloudType6:
      query: "*/UACLD{6}/CLTP"

    cloudAmount1:
      query: "*/UACLD{1}/CLAM"

    cloudAmount2:
      query: "*/UACLD{2}/CLAM"

    cloudAmount3:
      query: "*/UACLD{3}/CLAM"

    cloudAmount4:
      query: "*/UACLD{4}/CLAM"

    cloudAmount5:
      query: "*/UACLD{5}/CLAM"

    cloudAmount6:
      query: "*/UACLD{6}/CLAM"

    heightAboveSurfaceOfBaseOfLowestCloudSeen1:
      query: "*/UACLD{1}/HBLCS"

    heightAboveSurfaceOfBaseOfLowestCloudSeen2:
      query: "*/UACLD{2}/HBLCS"

    heightAboveSurfaceOfBaseOfLowestCloudSeen3:
      query: "*/UACLD{3}/HBLCS"

    heightAboveSurfaceOfBaseOfLowestCloudSeen4:
      query: "*/UACLD{4}/HBLCS"

    heightAboveSurfaceOfBaseOfLowestCloudSeen5:
      query: "*/UACLD{5}/HBLCS"

    heightAboveSurfaceOfBaseOfLowestCloudSeen6:
      query: "*/UACLD{6}/HBLCS"

    meanWindDirectionForSurface1500mLayer:
      query: "*/UAADF/MWDL"

    meanWindSpeedForSurface1500mLayer:
      query: "*/UAADF/MWSL"

    meanWindDirectionFor1500m3000mLayer:
      query: "*/UAADF/MWDH"

