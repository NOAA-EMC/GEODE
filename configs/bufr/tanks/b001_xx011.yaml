encoder:
  globals:
    - name: "description"
      type: string
      value: "Message Type 001-011 Surface Marine Buoy (SHEF)"

    - name: "dataCategory"
      type: string
      value: "surface marine"

    - name: "dataset"
      type: string
      value: "surface_buoy_moored"

    - name: "dataFormat"
      type: string
      value: "SHEF"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "001"

    - name: "bufrLocalSubcategory"
      type: string
      value: "011"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b001/xx011 NC001011"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/timePeriodMonths"
      source: variables/timePeriodMonths
      longName: "Time Period Or Displacement"
      units: "month"

    - name: "MetaData/timePeriodHours"
      source: variables/timePeriodHours
      longName: "Time Period Or Displacement"
      units: "h"

    - name: "MetaData/timePeriodMinutes"
      source: variables/timePeriodMinutes
      longName: "Time Period Or Displacement"
      units: "min"

    - name: "MetaData/sequenceNumber"
      source: variables/sequenceNumber
      longName: "Channel Sequence Number"

    - name: "MetaData/bulletinHeader"
      source: variables/bulletinHeader
      longName: "BULLETIN BEING MONITORED (TTAAii)"

    - name: "MetaData/bulletinOriginator"
      source: variables/bulletinOriginator
      longName: "Bulletin Being Monitored (CCCC)"

    - name: "MetaData/bulletinTime"
      source: variables/bulletinTime
      longName: "BULLETIN BEING MONITORED (YYGGgg)"

    - name: "MetaData/bulletinBBB"
      source: variables/bulletinBBB
      longName: "Bulletin Being Monitored (BBB)"

    - name: "MetaData/receiptTimeSignificance"
      source: variables/receiptTimeSignificance
      longName: "Receipt Time Significance"

    - name: "MetaData/stationIdentification"
      source: variables/stationIdentification
      longName: "Report Identifier"

    - name: "MetaData/stationElevation"
      source: variables/stationElevation
      longName: "Height Of Station Ground Above Msl"
      units: "m"

    - name: "MetaData/albedo"
      source: variables/albedo
      longName: "Albedo"
      units: "%"

    - name: "MetaData/riverStageHeightGageHeight"
      source: variables/riverStageHeightGageHeight
      longName: "River Stage Height (GAGE HEIGHT)"
      units: "m"

    - name: "MetaData/depthBelowLandSurfaceShstm1sq"
      source: variables/depthBelowLandSurfaceShstm1sq
      longName: "Depth Below Land Surface"
      units: "m"

    - name: "MetaData/depthBelowLandSurfaceShstm2sq"
      source: variables/depthBelowLandSurfaceShstm2sq
      longName: "Depth Below Land Surface"
      units: "m"

    - name: "MetaData/depthBelowLandSurfaceShxst1sq"
      source: variables/depthBelowLandSurfaceShxst1sq
      longName: "Depth Below Land Surface"
      units: "m"

    - name: "MetaData/depthBelowLandSurfaceShxst2sq"
      source: variables/depthBelowLandSurfaceShxst2sq
      longName: "Depth Below Land Surface"
      units: "m"

    - name: "MetaData/depthBelowLandSurfaceShist1sq"
      source: variables/depthBelowLandSurfaceShist1sq
      longName: "Depth Below Land Surface"
      units: "m"

    - name: "MetaData/depthBelowLandSurfaceShist2sq"
      source: variables/depthBelowLandSurfaceShist2sq
      longName: "Depth Below Land Surface"
      units: "m"

    # ObsValue
    - name: "ObsValue/airPressure"
      source: variables/airPressure
      longName: "Pressure"
      units: "Pa"

    - name: "ObsValue/pressureReducedToMeanSeaLevel"
