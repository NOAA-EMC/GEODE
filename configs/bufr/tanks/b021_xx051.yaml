bufr:
  subsets:
    - NC021051

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    satelliteIdentifier:
      query: "*/SAID"

    sensorScanPosition:
      query: "*/FOVN"

    satelliteZenithAngle:
      query: "*/SAZA"

    solarZenithAngle:
      query: "*/SOZA"

    cloudFromAVHRRCloudMask:
      query: "*/CLAVR"

    sensorChannelNumber1:
      query: "*/AVCSEQ{1}/INCN"

    sensorChannelNumber2:
      query: "*/AVCSEQ{2}/INCN"

    sensorChannelNumber3:
      query: "*/AVCSEQ{3}/INCN"

    sensorChannelNumber4:
      query: "*/AVCSEQ{4}/INCN"

    sensorChannelNumber5:
      query: "*/AVCSEQ{5}/INCN"

    albedo1:
      query: "*/AVCSEQ{1}/ALBD"

    albedo2:
      query: "*/AVCSEQ{2}/ALBD"

    albedo3:
      query: "*/AVCSEQ{3}/ALBD"

    albedo4:
      query: "*/AVCSEQ{4}/ALBD"

    albedo5:
      query: "*/AVCSEQ{5}/ALBD"

    # ObsValue
    brightnessTemperature1:
      query: "*/AVCSEQ{1}/TMBR"

    brightnessTemperature2:
      query: "*/AVCSEQ{2}/TMBR"

    brightnessTemperature3:
      query: "*/AVCSEQ{3}/TMBR"

    brightnessTemperature4:
      query: "*/AVCSEQ{4}/TMBR"

    brightnessTemperature5:
      query: "*/AVCSEQ{5}/TMBR"

  splits:
    satId:
      category:
        variable: satelliteIdentifier

encoder:
  globals:
    - name: "description"
      type: string
      value: "MTYP 021-051 PROC AVHRR(GAC) 1B Tb-CLR & SEA (N-17,M-2)"

    - name: "dataCategory"
      type: string
      value: "radiances from satellite"

    - name: "dataset"
      type: string
      value: "radiance_avhrr"

    - name: "dataFormat"
      type: string
      value: "binary"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "021"

    - name: "bufrLocalSubcategory"
      type: string
      value: "051"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b021/xx051 NC021051"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteIdentifier
      longName: "Satellite Identifier"

    - name: "MetaData/sensorScanPosition"
      source: variables/sensorScanPosition
      longName: "Field Of View Number"

    - name: "MetaData/satelliteZenithAngle"
      source: variables/satelliteZenithAngle
      longName: "Satellite Zenith Angle"
      units: "degree"

    - name: "MetaData/solarZenithAngle"
      source: variables/solarZenithAngle
      longName: "Solar Zenith Angle"
      units: "degree"

    - name: "MetaData/cloudFromAVHRRCloudMask"
      source: variables/cloudFromAVHRRCloudMask
      longName: "Cloud From Avhrr (CLAVR) Cloud Mask"

    - name: "MetaData/sensorChannelNumber1"
      source: variables/sensorChannelNumber1
      longName: "TOVS/ATOVS/AVHRR Instrumentation Channel Number (1)"

    - name: "MetaData/sensorChannelNumber2"
      source: variables/sensorChannelNumber2
      longName: "TOVS/ATOVS/AVHRR Instrumentation Channel Number (2)"

    - name: "MetaData/sensorChannelNumber3"
      source: variables/sensorChannelNumber3
      longName: "TOVS/ATOVS/AVHRR Instrumentation Channel Number (3)"

    - name: "MetaData/sensorChannelNumber4"
      source: variables/sensorChannelNumber4
      longName: "TOVS/ATOVS/AVHRR Instrumentation Channel Number (4)"

    - name: "MetaData/sensorChannelNumber5"
      source: variables/sensorChannelNumber5
      longName: "TOVS/ATOVS/AVHRR Instrumentation Channel Number (5)"

    - name: "MetaData/albedo1"
      source: variables/albedo1
      longName: "Albedo (1)"
      units: "%"

    - name: "MetaData/albedo2"
      source: variables/albedo2
      longName: "Albedo (2)"
      units: "%"

    - name: "MetaData/albedo3"
      source: variables/albedo3
      longName: "Albedo (3)"
      units: "%"

    - name: "MetaData/albedo4"
      source: variables/albedo4
      longName: "Albedo (4)"
      units: "%"

    - name: "MetaData/albedo5"
      source: variables/albedo5
      longName: "Albedo (5)"
      units: "%"

    # ObsValue
    - name: "ObsValue/brightnessTemperature1"
      source: variables/brightnessTemperature1
      longName: "Brightness Temperature (HIGH ACCURACY) (1)"
      units: "K"

    - name: "ObsValue/brightnessTemperature2"
      source: variables/brightnessTemperature2
      longName: "Brightness Temperature (HIGH ACCURACY) (2)"
      units: "K"

    - name: "ObsValue/brightnessTemperature3"
      source: variables/brightnessTemperature3
      longName: "Brightness Temperature (HIGH ACCURACY) (3)"
      units: "K"

    - name: "ObsValue/brightnessTemperature4"
      source: variables/brightnessTemperature4
      longName: "Brightness Temperature (HIGH ACCURACY) (4)"
      units: "K"

    - name: "ObsValue/brightnessTemperature5"
      source: variables/brightnessTemperature5
      longName: "Brightness Temperature (HIGH ACCURACY) (5)"
      units: "K"
