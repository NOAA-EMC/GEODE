bufr:
  subsets:
    - NC012150

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    satelliteIdentifier:
      query: "*/SAID"

    meteorologicalFeature1:
      query: "*/METFET[1]"

    meteorologicalFeature2:
      query: "*/METFET[2]"

    # ObsValue
    cloudphase:
      query: "*/CLDP"

    heightbasecloud:
      query: "*/HOCB"

    heightOfTopOfCloud:
      query: "*/HOCT"

    pressbasecloud:
      query: "*/CDBP"

    presstopcloud:
      query: "*/CDTP"

    equivblckbodytemp:
      query: "*/EBBTH"

    verintegliqwatercontent:
      query: "*/VILWC"

  splits:
    satId:
      category:
        variable: satelliteIdentifier

encoder:
  globals:
    - name: "description"
      type: string
      value: "M TYPE 012-150 NASA Langley pixel-level cloud data"

    - name: "dataCategory"
      type: string
      value: "surface data from satellite"

    - name: "dataset"
      type: string
      value: "retrieval_cloud_larc_goes"

    - name: "dataFormat"
      type: string
      value: "netCDF"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "012"

    - name: "bufrLocalSubcategory"
      type: string
      value: "150"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b012/xx150 NC012150"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteIdentifier
      longName: "Satellite Identifier"

    - name: "MetaData/meteorologicalFeature1"
      source: variables/meteorologicalFeature1
      longName: "Meteorological Feature"

    - name: "MetaData/meteorologicalFeature2"
      source: variables/meteorologicalFeature2
      longName: "Meteorological Feature"

    # ObsValue
    - name: "ObsValue/cloudphase"
      source: variables/cloudphase
      longName: "Cloud Phase"

    - name: "ObsValue/heightbasecloud"
      source: variables/heightbasecloud
      longName: "Height Of Base Of Cloud"
      units: "m"

    - name: "ObsValue/heightOfTopOfCloud"
      source: variables/heightOfTopOfCloud
      longName: "Height Of Top Of Cloud"
      units: "m"

    - name: "ObsValue/pressbasecloud"
      source: variables/pressbasecloud
      longName: "Pressure At Base Of Cloud"
      units: "Pa"

    - name: "ObsValue/presstopcloud"
      source: variables/presstopcloud
      longName: "Pressure At Top Of Cloud"
      units: "Pa"

    - name: "ObsValue/equivblckbodytemp"
      source: variables/equivblckbodytemp
      longName: "Equivalent Black Body Temperature"
      units: "K"

    - name: "ObsValue/verintegliqwatercontent"
      source: variables/verintegliqwatercontent
      longName: "VERTICALLY-INTEGRATED Liquid Water Content"
      units: "kg m-2"
