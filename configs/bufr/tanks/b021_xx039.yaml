    # ObsValue
    gqisflagqualdetailedQualityFlagForTheSystem:
      query: "*/QFFS"

    scaledIasiRadiance:
      query: "*/IASICHN/SCRA"

    scoreQuantizationFactor:
      query: "*/IASISC{1}/SQFA"

    residualRmsInBand:
      query: "*/IASISC{1}/RRIB"

    nonNormalisedPrincipalComponentScore:
      query: "*/IASISC{1}/IASIPCS/NNPCS"

    cloudFree:
