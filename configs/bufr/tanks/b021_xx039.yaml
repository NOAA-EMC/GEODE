    gqisqualindexIndicatorForInstrumentNoise:
      query: "*/QGQI"

    gqisqualindexlocIndicatorForGeometricQuality:
      query: "*/QGQIL"

    gqisqualindexradIndicatorForInstrumentNoise:
      query: "*/QGQIR"

    gqisqualindexspectIndicatorForInstrumentNoise:
      query: "*/QGQIS"

    gqissystecsondqualOutputOfSystemTecTechnical:
      query: "*/QGSSQ"

  splits:
    satId:
      category:
        variable: satelliteIdentifier

encoder:
  dimensions:
    - name: Channel
      source: variables/sensorChannelNumberIasichn
      path: "*/IASICHN"
    - name: Avhrchn
      source: variables/sensorChannelNumberAvhrchn
      path: "*/IASIL1CS{1}/AVHRCHN"
    # Variable length: appending can fail if the size changes
    - name: Iasipcs
      path: "*/IASISC{1}/IASIPCS"

  globals:
    - name: "description"
      type: string
      value: "Mtyp 021-039 RARS(EARS,AP,SA) Iasi Radiance Data (METOP"

    - name: "dataCategory"
      type: string
      value: "radiances from satellite"

    - name: "dataset"
      type: string
      value: "radiance_iasi_rars"

    - name: "dataFormat"
      type: string
      value: "BUFR"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "021"

    - name: "bufrLocalSubcategory"
      type: string
      value: "039"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b021/xx039 NC021039"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteIdentifier
      longName: "Satellite Identifier"

    - name: "MetaData/generatingCenterLong"
      source: variables/generatingCenterLong
      longName: "ORIGINATING/GENERATING Center"

    - name: "MetaData/instrumentIdentifier1"
      source: variables/instrumentIdentifier1
      longName: "Satellite Instruments"

    - name: "MetaData/satelliteConstellationRO"
      source: variables/satelliteConstellationRO
      longName: "Satellite Classification"

    - name: "MetaData/satelliteZenithAngle"
      source: variables/satelliteZenithAngle
      longName: "Satellite Zenith Angle"
      units: "degree"

    - name: "MetaData/sensorAzimuthAngle"
