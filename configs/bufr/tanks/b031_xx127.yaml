encoder:
  globals:
    - name: "description"
      type: string
      value: "031-127 Navoceano JASON-3 Altmr WIND/WAVE Fast Delivery"

    - name: "dataCategory"
      type: string
      value: "oceanographic data"

    - name: "dataset"
      type: string
      value: "marine_altimeter_jason3"

    - name: "dataFormat"
      type: string
      value: "BUFR"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "031"

    - name: "bufrLocalSubcategory"
      type: string
      value: "127"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b031/xx127 NC031127"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/receiptTimeSignificance"
      source: variables/receiptTimeSignificance
      longName: "Receipt Time Significance"

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteIdentifier
      longName: "Satellite Identifier"

    # ObsValue
    - name: "ObsValue/windSpeed"
      source: variables/windSpeed
      longName: "Wind Speed At 10 Meters"
      units: "m s-1"

    - name: "ObsValue/waveHeight"
      source: variables/waveHeight
      longName: "Height Of Waves"
      units: "m"

    - name: "ObsValue/standardDeviationOfSignificantWaveHeight"
      source: variables/standardDeviationOfSignificantWaveHeight
      longName: "Standard Deviation Of Significant Wave Height"
      units: "m"

    - name: "ObsValue/altitudePlatformToEllipsoid"
      source: variables/altitudePlatformToEllipsoid
      longName: "Altitude (PLATFORM To ELLIPSOID)"
      units: "m"

    - name: "ObsValue/peakiness"
      source: variables/peakiness
      longName: "Peakiness"

    - name: "ObsValue/altimeterCorrectionIonosphere"
      source: variables/altimeterCorrectionIonosphere
      longName: "Altimeter Correction (IONOSPHERE)"
      units: "m"

    - name: "ObsValue/altimeterCorrectionDryTroposphere"
      source: variables/altimeterCorrectionDryTroposphere
      longName: "Altimeter Correction (DRY TROPOSPHERE)"
      units: "m"

    - name: "ObsValue/altimeterCorrectionWetTroposphere"
      source: variables/altimeterCorrectionWetTroposphere
      longName: "Altimeter Correction (WET TROPOSPHERE)"
      units: "m"

    - name: "ObsValue/openLoopCorrectionAutoGainControl"
      source: variables/openLoopCorrectionAutoGainControl
      longName: "Open Loop Correction (AUTO Gain CONTROL)"
      units: "dB"

    - name: "ObsValue/backscatter"
      source: variables/backscatter
      longName: "Backscatter"
      units: "dB"

    # QualityMarker
    - name: "QualityMarker/correctedReportIndicator"
      source: variables/correctedReportIndicator
      longName: "Corrected Report Indicator"

    # Not in this tank: read as missing so the dataset has one set of variables
    - name: "MetaData/instrumentIdentifier"
      source: variables/instrumentIdentifier
      longName: "Satellite instruments"

    - name: "MetaData/stationAcquisition"
      source: variables/stationAcquisition
      longName: "Station acquisition"

    - name: "MetaData/softwareVersion"
      source: variables/softwareVersion
      longName: "Software identification and version number"

    - name: "MetaData/satelliteCycleNumber"
      source: variables/satelliteCycleNumber
      longName: "Satellite Cycle Number"

    - name: "MetaData/orbitNumber"
