bufr:
  subsets:
    - NC031121

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    receiptTime:
      datetime:
        year: "*/RCYR"
        month: "*/RCMO"
        day: "*/RCDY"
        hour: "*/RCHR"
        minute: "*/RCMI"

    latitude:
      query: "*/CLAT"

    longitude:
      query: "*/CLON"

    receiptTimeSignificance:
      query: "*/RCTS"

    satelliteIdentifier:
      query: "*/SAID"

    # ObsValue
    windSpeed:
      query: "*/WS10"

    waveHeight:
      query: "*/HOWV"

    standardDeviationOfSignificantWaveHeight:
      query: "*/SDWH"

    altitudePlatformToEllipsoid:
      query: "*/ALTPE"

    peakiness:
      query: "*/PEAK"

    altimeterCorrectionIonosphere:
      query: "*/ACIO"

    altimeterCorrectionDryTroposphere:
      query: "*/ACDT"

    altimeterCorrectionWetTroposphere:
      query: "*/ACWT"

    openLoopCorrectionAutoGainControl:
      query: "*/OLCA"

    backscatter:
      query: "*/BKST"

    # QualityMarker
    correctedReportIndicator:
      query: "*/CORN"

    # Not in this tank: other tanks in this dataset have these
    instrumentIdentifier:
      query: "*/ABSENT"
      type: int

    stationAcquisition:
      query: "*/ABSENT"
      type: string

    softwareVersion:
      query: "*/ABSENT"
      type: string

    satelliteCycleNumber:
      query: "*/ABSENT"
      type: int

    orbitNumber:
      query: "*/ABSENT"
      type: int

    numericalModelIdentifier:
      query: "*/ABSENT"
      type: string

    secondWithinAMinuteMicrosecondAccuracy:
      query: "*/ABSENT"
      type: float

    remotelySensedSurfaceType:
      query: "*/ABSENT"
      type: int

    radiometerSensedSurfaceType:
      query: "*/ABSENT"
      type: int

    v3DErrorEstimateOfTheNavigatorOrbit:
      query: "*/ABSENT"
      type: int

    bandSpecificAltimeterDataQualityFlag:
      query: "*/ABSENT"
      type: int

    bandSpecificAltimeterCorrectionQualityFlag:
      query: "*/ABSENT"
      type: int

    sensorCentralFrequency1:
      query: "*/ABSENT"
      type: int64

    specificBandNetInstrumentalCorrection:
      query: "*/ABSENT"
