bufr:
  subsets:
    - NC021246

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    latitude:
      query: "*/PIXELS{1}/CLATH"

    longitude:
      query: "*/PIXELS{1}/CLONH"

    satelliteIdentifier:
      query: "*/SAID"

    instrumentIdentifier:
      query: "*/SIID"

    dataProviderOrigin:
      query: "*/OGCE"

    generatingSubCenter:
      query: "*/GSES"

    sensorChannelNumberChinfo:
      query: "*/CHINFO/CHNM"

    sensorCentralFrequency:
      query: "*/CHINFO/SCCF"

    sensorBandWidth:
      query: "*/CHINFO/SCBW"

    antennaPolarization:
      query: "*/CHINFO/ANPO"

    scanLineNumber:
      query: "*/SLNM"

    heightOfStation:
      query: "*/HMSL"

    latitude2:
      query: "*/PIXELS{1}/CLATH"

    longitude2:
      query: "*/PIXELS{1}/CLONH"

    sensorScanPosition:
      query: "*/PIXELS{1}/FOVN"

    satelliteZenithAngle1:
      query: "*/PIXELS{1}/GMIANG{1}/SAZA"

    satelliteZenithAngle2:
      query: "*/PIXELS{1}/GMIANG{2}/SAZA"

    sensorAzimuthAngle1:
      query: "*/PIXELS{1}/GMIANG{1}/BEARAZ"

    sensorAzimuthAngle2:
      query: "*/PIXELS{1}/GMIANG{2}/BEARAZ"

    solarZenithAngle1:
      query: "*/PIXELS{1}/GMIANG{1}/SOZA"

    solarZenithAngle2:
      query: "*/PIXELS{1}/GMIANG{2}/SOZA"

    solarAzimuthAngle1:
      query: "*/PIXELS{1}/GMIANG{1}/SOLAZI"

    solarAzimuthAngle2:
      query: "*/PIXELS{1}/GMIANG{2}/SOLAZI"

    satelliteSunGlintAngle1:
      query: "*/PIXELS{1}/GMIANG{1}/SSGA"

    satelliteSunGlintAngle2:
      query: "*/PIXELS{1}/GMIANG{2}/SSGA"

    sensorChannelNumberGmicht:
      query: "*/PIXELS{1}/GMICHT/CHNM"

    # ObsValue
    brightnessTemperature:
      query: "*/PIXELS{1}/GMICHT/TMBR"

    # QualityMarker
    v2BitIndicatorOfQuality:
      query: "*/PIXELS{1}/GMICHT/TPQC2"

    radianceDataQualityFlags:
      query: "*/PIXELS{1}/GMICHT/VIIRSQ"

  splits:
    satId:
      category:
        variable: satelliteIdentifier

encoder:
  dimensions:
    - name: Channel
      source: variables/sensorChannelNumberChinfo
      path: "*/CHINFO"
    - name: Gmicht
      source: variables/sensorChannelNumberGmicht
      path: "*/PIXELS{1}/GMICHT"

  globals:
    - name: "description"
      type: string
      value: "Mtyp 021-246 Gmi L1C-R BRIGHT. Temperatures (GPM-CORE)"

    - name: "dataCategory"
      type: string
      value: "radiances from satellite"

    - name: "dataset"
      type: string
      value: "radiance_gmi"

    - name: "dataFormat"
      type: string
      value: "BUFR"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "021"

    - name: "bufrLocalSubcategory"
      type: string
      value: "246"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b021/xx246 NC021246"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteIdentifier
      longName: "Satellite Identifier"

    - name: "MetaData/instrumentIdentifier"
      source: variables/instrumentIdentifier
      longName: "Satellite Instruments"

    - name: "MetaData/dataProviderOrigin"
      source: variables/dataProviderOrigin
      longName: "Identification Of ORIGINATING/GENERATING Center"

    - name: "MetaData/generatingSubCenter"
      source: variables/generatingSubCenter
      longName: "Identification Of ORIGINATING/GENERATING SUB-CENTER"

    - name: "MetaData/sensorChannelNumberChinfo"
      source: variables/sensorChannelNumberChinfo
      longName: "Channel Number"

    - name: "MetaData/sensorCentralFrequency"
      source: variables/sensorCentralFrequency
      longName: "Satellite Channel Center Frequency"
      units: "Hz"

    - name: "MetaData/sensorBandWidth"
      source: variables/sensorBandWidth
      longName: "Satellite Channel Band Width"
      units: "Hz"

    - name: "MetaData/antennaPolarization"
      source: variables/antennaPolarization
      longName: "Antenna Polarization"

    - name: "MetaData/scanLineNumber"
      source: variables/scanLineNumber
      longName: "Scan Line Number"

    - name: "MetaData/heightOfStation"
      source: variables/heightOfStation
      longName: "Height Or Altitude"
      units: "m"

    - name: "MetaData/latitude2"
      source: variables/latitude2
      longName: "Latitude (HIGH ACCURACY)"
      units: "degree"

    - name: "MetaData/longitude2"
      source: variables/longitude2
      longName: "Longitude (HIGH ACCURACY)"
      units: "degree"

    - name: "MetaData/sensorScanPosition"
      source: variables/sensorScanPosition
      longName: "Field Of View Number"

    - name: "MetaData/satelliteZenithAngle1"
      source: variables/satelliteZenithAngle1
      longName: "Satellite Zenith Angle (1)"
      units: "degree"

    - name: "MetaData/satelliteZenithAngle2"
      source: variables/satelliteZenithAngle2
      longName: "Satellite Zenith Angle (2)"
      units: "degree"

    - name: "MetaData/sensorAzimuthAngle1"
      source: variables/sensorAzimuthAngle1
      longName: "Bearing Or Azimuth (1)"
      units: "degree"

    - name: "MetaData/sensorAzimuthAngle2"
      source: variables/sensorAzimuthAngle2
      longName: "Bearing Or Azimuth (2)"
      units: "degree"

    - name: "MetaData/solarZenithAngle1"
      source: variables/solarZenithAngle1
      longName: "Solar Zenith Angle (1)"
      units: "degree"

    - name: "MetaData/solarZenithAngle2"
      source: variables/solarZenithAngle2
      longName: "Solar Zenith Angle (2)"
      units: "degree"

    - name: "MetaData/solarAzimuthAngle1"
      source: variables/solarAzimuthAngle1
      longName: "Solar Azimuth (1)"
      units: "degree"

    - name: "MetaData/solarAzimuthAngle2"
      source: variables/solarAzimuthAngle2
      longName: "Solar Azimuth (2)"
      units: "degree"

    - name: "MetaData/satelliteSunGlintAngle1"
      source: variables/satelliteSunGlintAngle1
      longName: "SATELLITE-SUN Glint Angle (1)"
      units: "degree"

    - name: "MetaData/satelliteSunGlintAngle2"
      source: variables/satelliteSunGlintAngle2
      longName: "SATELLITE-SUN Glint Angle (2)"
      units: "degree"

    - name: "MetaData/sensorChannelNumberGmicht"
      source: variables/sensorChannelNumberGmicht
      longName: "Channel Number"

    # ObsValue
    - name: "ObsValue/brightnessTemperature"
      source: variables/brightnessTemperature
      longName: "Brightness Temperature (HIGH ACCURACY)"
      units: "K"

    # QualityMarker
    - name: "QualityMarker/v2BitIndicatorOfQuality"
      source: variables/v2BitIndicatorOfQuality
      longName: "2-BIT Indicator Of Quality"

    - name: "QualityMarker/radianceDataQualityFlags"
      source: variables/radianceDataQualityFlags
      longName: "Radiance Data Quality Flags"
