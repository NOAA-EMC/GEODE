# Mapping for BUFR Table A message types
# using local descriptors
# from type codes to snake case strings
# Legacy decoding using local descriptors
# would produce BUFR tanks of the form bAAA/xxBBB
# This YAML file provides the mapping from AAA and BBB to their corresponding snake case strings
# 
# The file is structured as so:
# A:
#   category: <category_name>
#   standard subtypes: {} # not yet used
#   local subtypes:
#     BBB:
#       dataset: <dataset_name> (what user will request/how it will be stored as one dataset)
#       format: <format_name> (e.g., BUFR, SHEF, WMO FM-12 SYNOP) which will be metadata for each observation
#       restricted: <true/false>
#
# note each observation will have metadata indicating its raw category and local subtype integers
#
# A good reference for this is https://www.emc.ncep.noaa.gov/emc/pages/infrastructure/bufrlib/tables/bufrtab_tablea.html
#
# Also note, the final dataset names may have additional suffixes
# such as platform, channel subset, or other distinguishing features
#
