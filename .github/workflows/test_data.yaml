name: Exercise Data Retrieval Test

on:
  push:
  pull_request:
  schedule:
    # Run daily at midnight to verify data downloads remain functional
    - cron: '0 0 * * *'

jobs:
  test-data:
    name: Run uprair retrieval test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run test using pytest
        run: |
          python -m pytest test/test_get_data.py -v
