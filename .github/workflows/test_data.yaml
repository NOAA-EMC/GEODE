name: Exercise Data Retrieval Test

on:
  push:
  pull_request:
  schedule:
    # Run daily at midnight to verify data downloads remain functional
    - cron: '0 0 * * *'

jobs:
  test-data:
    name: Run uprair retrieval test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/noaa-emc/geode:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run test using pytest
        run: |
          python -m pytest test/test_get_data.py -v
