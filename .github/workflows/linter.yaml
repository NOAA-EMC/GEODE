name: Lint Repository Norms

on:
  push:
  pull_request:

jobs:
  lint:
    name: Python coding norms
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository context
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$GITHUB_WORKSPACE" ]]; then
            echo "FATAL ERROR: repository workspace is missing"
            exit 1
          fi
          echo "Repository root: $GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Check Python coding norms
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t python_files < <(find . -type f -name '*.py' | sort)
          if [[ ${#python_files[@]} -eq 0 ]]; then
            echo "WARNING: no Python files found"
            exit 0
          fi
          python -m ruff format --check --diff "${python_files[@]}"
          python -m ruff check --output-format=github "${python_files[@]}"
