name: Lint Repository Norms

on:
  push:
  pull_request:

jobs:
  lint:
    name: Python coding norms
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository context
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$GITHUB_WORKSPACE" ]]; then
            echo "FATAL ERROR: repository workspace is missing"
            exit 1
          fi
          echo "Repository root: $GITHUB_WORKSPACE"

      - name: Check Ruff formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: "src/geode test"
          args: "format --check --diff"

      - name: Check Ruff lint rules
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: "src/geode test"
          args: "check"
