name: Lint Repository Norms

on:
  push:
  pull_request:

jobs:
  lint:
    name: Python and C++ norms
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository context
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$GITHUB_WORKSPACE" ]]; then
            echo "FATAL ERROR: repository workspace is missing"
            exit 1
          fi
          echo "Repository root: $GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Install C++ formatting tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check Python coding norms
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t python_files < <(find . -type f -name '*.py' | sort)
          if [[ ${#python_files[@]} -eq 0 ]]; then
            echo "WARNING: no Python files found"
            exit 0
          fi
          python -m ruff check --output-format=github "${python_files[@]}"

      - name: Check C++ coding norms
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t cpp_files < <(find . -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' -o -name '*.h' -o -name '*.hh' -o -name '*.hpp' \) | sort)
          if [[ ${#cpp_files[@]} -eq 0 ]]; then
            echo "WARNING: no C++ files found"
            exit 0
          fi
          for file in "${cpp_files[@]}"; do
            clang-format --dry-run --Werror -style=file "$file"
          done
