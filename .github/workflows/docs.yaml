name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - develop
  workflow_dispatch:
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip' # Speeds up builds by caching pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install MkDocs, Material theme, and the Python docstrings plugin
          pip install mkdocs-material mkdocstrings[python]
          
          # Optional: If your project needs to be installed to read the docstrings
          # pip install -e . 
          # Or if you have a separate requirements file for docs:
          # pip install -r docs/requirements.txt

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
  