name: Exercise Data Retrieval Test

on:
  push:
  pull_request:
  schedule:
    # Run daily at 11:30 UTC to verify data downloads remain functional
    - cron: '30 11 * * *'

jobs:
  test-data:
    name: Run WIS2 Data Retrieval Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/noaa-emc/geode:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run test
        run: |
          python -m pytest test/test_wis2_listener.py -v -s -W error::pytest.PytestUnhandledThreadExceptionWarning
  