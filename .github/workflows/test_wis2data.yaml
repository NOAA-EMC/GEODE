name: Exercise Data Retrieval Test

on:
  push:
  pull_request:
  schedule:
    # Run daily at 11:30 UTC to verify data downloads remain functional
    - cron: '30 11 * * *'

jobs:
  test-data:
    name: Run WIS2 Data Retrieval Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/noaa-emc/geode:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest paho-mqtt requests

      - name: Run test using pytest
        run: |
          python -m pytest test/test_wis2_watcher.py -v -s

      - name: Show downloaded files
        run: |
          ls -l /tmp/pytest-of-root/pytest-0/test_wis2_watcher0/
