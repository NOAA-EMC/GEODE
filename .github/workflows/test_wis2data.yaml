name: Exercise Data Retrieval Test

on:
  push:
  pull_request:
  schedule:
    # Run daily at 11:30 UTC to verify data downloads remain functional
    - cron: '30 11 * * *'

jobs:
  test-data:
    name: Run WIS2 Data Retrieval Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pywis-pubsub requests

      - name: Run test using pytest
        run: |
          python -m pytest test/test_wis2_watcher.py -v -s

      - name: Show downloaded files
        run: |
          if ! command -v debufr >/dev/null 2>&1; then
            echo "WARNING: debufr is unavailable; skipping BUFR decode output"
            exit 0
          fi
          find /tmp/pytest-of-* -type f -exec sh -c '
            for file do
              echo "Contents of $file:"
              debufr -o "$file".debufr.out "$file"
              cat "$file".debufr.out
            done
          ' sh {} +
