name: Exercise Data Retrieval Test

on:
  push:
  pull_request:
  schedule:
    # Run daily at 11:30 UTC to verify data downloads remain functional
    - cron: '30 11 * * *'

jobs:
  test-data:
    name: Run WIS2 Data Retrieval Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build devcontainer image
        run: |
          docker build -t geode-devcontainer-ci -f .devcontainer/Dockerfile .

      - name: Run test and show downloaded files in devcontainer
        run: |
          mkdir -p "${RUNNER_TEMP}/geode-ci-tmp/pytest-of-geode" "${RUNNER_TEMP}/geode-ci-tmp/pytest-cache"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL \
            -v "${GITHUB_WORKSPACE}:/workspaces/GEODE:ro" \
            -v "${RUNNER_TEMP}/geode-ci-tmp:/ci-tmp" \
            -w /workspaces/GEODE \
            geode-devcontainer-ci \
            bash -e -u -o pipefail -c '
              artifact_dir=/ci-tmp/pytest-of-geode
              cache_dir=/ci-tmp/pytest-cache
              mkdir -p "${artifact_dir}" "${cache_dir}"
              python -m pytest test/test_wis2_watcher.py -v -s \
                --basetemp="${artifact_dir}" \
                -o cache_dir="${cache_dir}"
              if ! command -v debufr >/dev/null 2>&1; then
                echo "WARNING: debufr is unavailable; skipping BUFR decode output"
              elif [[ -z "$(find "${artifact_dir}" -type f -print -quit)" ]]; then
                echo "WARNING: no pytest download artifacts found under ${artifact_dir}"
              else
                while IFS= read -r file; do
                  echo "Contents of ${file}:"
                  debufr -o "${file}".debufr.out "${file}"
                  cat "${file}".debufr.out
                done < <(find "${artifact_dir}" -type f ! -name "*.debufr.out" -print)
              fi
            '
