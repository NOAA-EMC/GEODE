name: Build and Push Container

on:
  push:
    branches: [feature/container]
  schedule:
    # Runs at 22:00 UTC every Saturday
    - cron: '0 22 * * 6'
  workflow_dispatch: # Allows manual triggering

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo docker image prune --all --force
        df -h

    - name: Checkout
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate image metadata
      id: meta
      run: |
        IMAGE_NAME=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        DATE_TAG=$(date +'%Y%m%d')
        SHA_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
        echo "image=${IMAGE_NAME}" >> $GITHUB_OUTPUT
        echo "date_tag=${DATE_TAG}" >> $GITHUB_OUTPUT
        echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: .devcontainer/Dockerfile
        push: true
        tags: |
          ${{ steps.meta.outputs.image }}:latest
          ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.date_tag }}
          ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
