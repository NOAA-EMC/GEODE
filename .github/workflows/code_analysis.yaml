name: Perform Code Analysis

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff) + formatting check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository context
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$GITHUB_WORKSPACE" ]]; then
            echo "FATAL ERROR: repository workspace is missing"
            exit 1
          fi
          echo "Repository root: $GITHUB_WORKSPACE"

      - name: Ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: "src/geode test"
          args: "format --check --diff"

      - name: Ruff format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: "src/geode test"
          args: "check"
  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository context
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$GITHUB_WORKSPACE" ]]; then
            echo "FATAL ERROR: repository workspace is missing"
            exit 1
          fi
          echo "Repository root: $GITHUB_WORKSPACE"

      - name: Mypy type check
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install mypy

      - name: Run mypy
        run: mypy src/geode test
  bandit:
    name: Bandit (SAST)
    runs-on: ubuntu-latest
    continue-on-error: true # can tighten later
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]

      - name: Run bandit
        run: bandit -r . -ll -x test

  pip-audit:
    name: Dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: true # start in report mode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run pip-audit
        run: pip-audit

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
