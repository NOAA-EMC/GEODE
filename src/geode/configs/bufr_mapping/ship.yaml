bufr:
  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"

    latitude:
      query: "*/CLAT"

    longitude:
      query: "*/CLON"

    pressure:
      query: "*/PRES"

    temperature:
      query: "*/TEMP"

    wetBulbTemperature:
      query: "*/TMWB"

    dewPointTemperature:
      query: "*/TMDP"

    relativeHumidity:
      query: "*/REHU"

    windSpeed:
      query: "*/WSPD"

    windDirection:
      query: "*/WDIR"

encoder:
  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z" 
  
    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]
  
    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "ObsValue/pressure"
      source: variables/pressure
      longName: "Pressure"
      units: "hPa"
    
    - name: "ObsValue/temperature"
      source: variables/temperature
      longName: "Temperature"
      units: "K"

    - name: "ObsValue/wetBulbTemperature"
      source: variables/wetBulbTemperature
      longName: "Wet Bulb Temperature"
      units: "K"

    - name: "ObsValue/dewPointTemperature"
      source: variables/dewPointTemperature
      longName: "Dew Point Temperature"
      units: "K"

    - name: "ObsValue/relativeHumidity"
      source: variables/relativeHumidity
      longName: "Relative Humidity"
      units: "%"
  
    - name: "ObsValue/windSpeed"
      source: variables/windSpeed
      longName: "Wind Speed"
      units: "m/s"

    - name: "ObsValue/windDirection"
      source: variables/windDirection
      longName: "Wind Direction"
      units: "degree"


  
